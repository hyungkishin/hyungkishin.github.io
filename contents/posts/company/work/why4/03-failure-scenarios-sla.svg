<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>

  <text x="460" y="36" fill="#1f2937" font-size="18" font-weight="600" text-anchor="middle">장애가 난 뒤 어떤 사용자를 다시 처리할까?</text>
  <text x="460" y="58" fill="#64748b" font-size="12" text-anchor="middle">A. 외부 API 일시 장애 / B. Pod 중간 죽음 / C. 모수 폭증</text>

  <!-- A -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="280" height="380" rx="10" fill="#f1f5f9" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="28" fill="#f59e0b" font-size="13" font-weight="600" text-anchor="middle">A. 외부 API 일시 장애</text>
    <text x="140" y="46" fill="#4b5563" font-size="11" text-anchor="middle">응답 지연/오류 수분~수시간</text>

    <rect x="20" y="74" width="240" height="30" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="30" y="93" fill="#ef4444" font-size="11">Before</text>
    <text x="250" y="93" fill="#ef4444" font-size="11" text-anchor="end">며칠째 같은 사용자 누락</text>

    <text x="140" y="124" fill="#4b5563" font-size="11" text-anchor="middle">3s timeout → silent skip</text>
    <text x="140" y="140" fill="#4b5563" font-size="11" text-anchor="middle">→ 다음날 또 timeout</text>

    <rect x="20" y="158" width="240" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="177" fill="#10b981" font-size="11">After</text>
    <text x="250" y="177" fill="#10b981" font-size="11" text-anchor="end">미처리 사용자 추적</text>

    <text x="140" y="208" fill="#4b5563" font-size="11" text-anchor="middle">getStatForBatch (~10s 대기)</text>
    <text x="140" y="224" fill="#4b5563" font-size="11" text-anchor="middle">timeoutQueue 별도 추적</text>
    <text x="140" y="240" fill="#4b5563" font-size="11" text-anchor="middle">다음 실행에서 미처리 건 재조회</text>

    <rect x="20" y="262" width="240" height="100" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <text x="30" y="282" fill="#4b5563" font-size="10">트레이드오프</text>
    <text x="30" y="302" fill="#64748b" font-size="10">단건 처리 시간 ↑</text>
    <text x="30" y="318" fill="#64748b" font-size="10">첫 실행의 경과 시간도 함께 측정</text>
    <text x="30" y="338" fill="#64748b" font-size="10">누락 0건이 더 비싸다</text>
  </g>

  <!-- B -->
  <g transform="translate(330, 100)">
    <rect x="0" y="0" width="260" height="380" rx="10" fill="#f1f5f9" stroke="#a78bfa" stroke-width="2"/>
    <text x="130" y="28" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="middle">B. Pod 중간 죽음</text>
    <text x="130" y="46" fill="#4b5563" font-size="11" text-anchor="middle">OOM, 운영자의 강제 종료, 배포 충돌</text>

    <rect x="20" y="74" width="220" height="30" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="30" y="93" fill="#ef4444" font-size="11">Before</text>
    <text x="230" y="93" fill="#ef4444" font-size="11" text-anchor="end">처음부터 다시</text>

    <text x="130" y="124" fill="#4b5563" font-size="11" text-anchor="middle">8천 처리 후 죽음</text>
    <text x="130" y="140" fill="#4b5563" font-size="11" text-anchor="middle">→ 1만 모수 다시</text>

    <rect x="20" y="158" width="220" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="177" fill="#10b981" font-size="11">After</text>
    <text x="230" y="177" fill="#10b981" font-size="11" text-anchor="end">미처리 분량만 재처리</text>

    <text x="130" y="208" fill="#4b5563" font-size="11" text-anchor="middle">멱등 필터로 8천 skip</text>
    <text x="130" y="224" fill="#4b5563" font-size="11" text-anchor="middle">2천 명만 모수에 잡힘</text>
    <text x="130" y="240" fill="#4b5563" font-size="11" text-anchor="middle">재실행 비용 1/5</text>

    <rect x="20" y="262" width="220" height="100" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <text x="30" y="282" fill="#4b5563" font-size="10">트레이드오프</text>
    <text x="30" y="302" fill="#64748b" font-size="10">추가 쿼리 1회</text>
    <text x="30" y="318" fill="#64748b" font-size="10">ID Set 메모리 ~4MB</text>
    <text x="30" y="338" fill="#64748b" font-size="10">후보 수와 메모리 사용량 확인</text>
  </g>

  <!-- C -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="280" height="380" rx="10" fill="#f1f5f9" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="28" fill="#10b981" font-size="13" font-weight="600" text-anchor="middle">C. 모수 폭증</text>
    <text x="140" y="46" fill="#4b5563" font-size="11" text-anchor="middle">신규 가입자 폭증 + 누적 지연</text>

    <rect x="20" y="74" width="240" height="30" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="30" y="93" fill="#ef4444" font-size="11">Before</text>
    <text x="250" y="93" fill="#ef4444" font-size="11" text-anchor="end">8h 초과 → cron 겹침</text>

    <text x="140" y="124" fill="#4b5563" font-size="11" text-anchor="middle">단건 시간 평소보다 ↑</text>
    <text x="140" y="140" fill="#4b5563" font-size="11" text-anchor="middle">다음 cron과 충돌</text>

    <rect x="20" y="158" width="240" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="177" fill="#10b981" font-size="11">After</text>
    <text x="250" y="177" fill="#10b981" font-size="11" text-anchor="end">7시간 타임박스 적용</text>

    <text x="140" y="208" fill="#4b5563" font-size="11" text-anchor="middle">7h timebox로 강제 종료</text>
    <text x="140" y="224" fill="#4b5563" font-size="11" text-anchor="middle">다음날 cron이 이어 처리</text>
    <text x="140" y="240" fill="#4b5563" font-size="11" text-anchor="middle">남은 건수와 발송 기한 대조</text>

    <rect x="20" y="262" width="240" height="100" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <text x="30" y="282" fill="#4b5563" font-size="10">트레이드오프</text>
    <text x="30" y="302" fill="#64748b" font-size="10">단일 실행 100% 보장 X</text>
    <text x="30" y="318" fill="#64748b" font-size="10">발송이 적재 후 익일이라</text>
    <text x="30" y="338" fill="#64748b" font-size="10">SLA 기준선 합의 필요</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="500" width="840" height="40" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
  <text x="460" y="525" fill="#4b5563" font-size="12" text-anchor="middle">발송 전에 끝낼 수 있는지는 미처리 건수와 외부 API의 복구 시점에 달려 있다.</text>
</svg>
