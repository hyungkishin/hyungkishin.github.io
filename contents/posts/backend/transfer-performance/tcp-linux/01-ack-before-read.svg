<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 342" role="img" aria-labelledby="title desc">
  <title id="title">순서 번호 1000부터 8바이트가 도착했을 때의 TCP ACK</title>
  <desc id="desc">연결 수립 후 보낸 8바이트를 수신 TCP가 순서대로 받아 다음 순서 번호 1008을 확인한다. 그림에서는 애플리케이션이 나중에 읽는다. 화살표는 가능한 동작 순서를 보여 준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#2455df" stroke-width="1.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; fill: #101d35; }
    .title { font-size: 23px; font-weight: 760; }
    .name { font-size: 18px; font-weight: 680; text-anchor: middle; }
    .data { font-size: 18px; font-weight: 640; fill: #1745c2; text-anchor: middle; }
    .note { font-size: 16px; font-weight: 520; fill: #33445e; text-anchor: middle; }
    .axis { stroke: #b9cbe8; stroke-width: 2; stroke-dasharray: 4 5; }
    .wire { fill: none; stroke: #2455df; stroke-width: 2.6; marker-end: url(#arrow); }
    .pulse circle { opacity: 0; fill: #1745c2; }
    @media (prefers-reduced-motion: no-preference) {
      .send { animation: send 7s linear infinite; }
      .ack { animation: ack 7s linear infinite; }
      .read { animation: read 7s linear infinite; }
    }
    @keyframes send { 0%, 4% { opacity: 0; } 6% { opacity: 1; } 25% { opacity: 1; transform: translateX(169px); } 27%, 100% { opacity: 0; transform: translateX(169px); } }
    @keyframes ack { 0%, 32% { opacity: 0; } 34% { opacity: 1; } 53% { opacity: 1; transform: translateX(-169px); } 55%, 100% { opacity: 0; transform: translateX(-169px); } }
    @keyframes read { 0%, 62% { opacity: 0; } 64% { opacity: 1; } 85% { opacity: 1; transform: translateX(172px); } 87%, 100% { opacity: 0; transform: translateX(172px); } }
  </style>
  <rect width="500" height="342" fill="#fff"/>
  <text class="title" x="22" y="36">8바이트를 받은 TCP가 보내는 ACK</text>
  <g fill="#f1f6ff" stroke="#d1ddf3">
    <rect x="18" y="60" width="115" height="39" rx="7"/>
    <rect x="190" y="60" width="120" height="39" rx="7"/>
    <rect x="365" y="60" width="115" height="39" rx="7"/>
  </g>
  <g class="name"><text x="75" y="85">송신 TCP</text><text x="250" y="85">수신 커널</text><text x="422" y="85">수신 앱</text></g>
  <g class="axis"><path d="M75 99V290"/><path d="M250 99V290"/><path d="M422 99V290"/></g>
  <g class="data"><text x="162" y="132">SEQ 1000 (8 B)</text><text x="162" y="194">누적 ACK 1008</text><text x="336" y="255">읽힌 바이트</text></g>
  <g class="wire"><path d="M76 146H247"/><path d="M249 207H78"/><path d="M251 269H419"/></g>
  <rect x="338" y="177" width="147" height="46" rx="8" fill="#f1f6ff" stroke="#cfdbf1"/>
  <text class="note" x="412" y="206">read 호출 전</text>
  <g class="pulse"><circle class="send" cx="77" cy="146" r="5"/><circle class="ack" cx="248" cy="207" r="5"/><circle class="read" cx="250" cy="269" r="5"/></g>
  <text class="note" x="250" y="321">수신 TCP가 기다리는 다음 바이트는 1008번이다.</text>
</svg>
