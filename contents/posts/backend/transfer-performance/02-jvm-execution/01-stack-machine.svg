<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">JVM 피연산자 스택과 지역변수의 상태 전환</title>
  <desc id="desc">iconst_0이 정수 0을 스택에 넣고 istore_1이 지역변수 슬롯 1로 옮긴다. iload_1과 bipush 10이 비교할 두 값을 넣으면 if_icmpge가 꺼낸다. 출력 호출 뒤의 iinc는 스택을 바꾸지 않고 슬롯 1을 0에서 1로 증가시킨다. 모션 감소 설정에서는 전체 관계를 정적으로 표시한다.</desc>
  <style>
    text { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #1c2738; font-size: 22px; }
    .heading { font-size: 32px; font-weight: 750; }
    .label { font-size: 23px; font-weight: 700; }
    .muted { fill: #58677b; font-size: 20px; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 25px; }
    .value { font-size: 30px; font-weight: 750; fill: #225bce; }
    .scene { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .fallback { display: none; }
      .scene { display: inline; opacity: 0; animation-duration: 18s; animation-iteration-count: infinite; animation-timing-function: step-end; }
      .s0 { animation-name: step0; }
      .s1 { animation-name: step1; }
      .s2 { animation-name: step2; }
      .s3 { animation-name: step3; }
      .s4 { animation-name: step4; }
      .s5 { animation-name: step5; }
    }
    @keyframes step0 { 0%, 16.66% { opacity: 1; } 16.67%, 100% { opacity: 0; } }
    @keyframes step1 { 0%, 16.66% { opacity: 0; } 16.67%, 33.32% { opacity: 1; } 33.33%, 100% { opacity: 0; } }
    @keyframes step2 { 0%, 33.32% { opacity: 0; } 33.33%, 49.99% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes step3 { 0%, 49.99% { opacity: 0; } 50%, 66.65% { opacity: 1; } 66.66%, 100% { opacity: 0; } }
    @keyframes step4 { 0%, 66.65% { opacity: 0; } 66.66%, 83.32% { opacity: 1; } 83.33%, 100% { opacity: 0; } }
    @keyframes step5 { 0%, 83.32% { opacity: 0; } 83.33%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scene { display: none; animation: none; } .fallback { display: inline; } }
  </style>
  <rect width="960" height="620" rx="24" fill="#fff"/>
  <text x="36" y="55" class="heading">값을 옮기는 명령과 직접 바꾸는 명령</text>
  <text x="36" y="91" class="muted">main의 첫 반복: 오른쪽이 피연산자 스택의 맨 위</text>
  <rect x="32" y="125" width="280" height="310" rx="18" fill="#f4f7fc" stroke="#d6deeb"/>
  <rect x="336" y="125" width="272" height="310" rx="18" fill="#f4f7fc" stroke="#d6deeb"/>
  <rect x="632" y="125" width="296" height="310" rx="18" fill="#eff5ff" stroke="#bacff2"/>
  <text x="54" y="166" class="label">실행 명령</text>
  <text x="358" y="166" class="label">지역변수</text>
  <text x="654" y="166" class="label">피연산자 스택</text>
  <text x="358" y="222" class="muted">슬롯 0: args 참조</text>
  <text x="358" y="270" class="muted">슬롯 1: i</text>
  <g class="fallback">
    <text x="54" y="230" class="mono">iload_1</text>
    <text x="54" y="275" class="mono">bipush 10</text>
    <text x="54" y="320" class="mono">if_icmpge 22</text>
    <text x="54" y="387" class="mono">iinc 1, 1</text>
    <text x="358" y="324" class="value">0 → 1</text>
    <text x="358" y="385" class="muted">iinc가 직접 증가</text>
    <text x="654" y="246" class="value">[0] → [0, 10]</text>
    <text x="654" y="298" class="value">비교 뒤 [ ]</text>
    <text x="654" y="382" class="muted">iinc 실행 중 변화 없음</text>
    <text x="36" y="490" class="label">스택에 비교값을 넣고 꺼낸 뒤, iinc는 지역변수만 바꾼다.</text>
  </g>
  <g class="scene s0">
    <text x="54" y="242" class="mono">iconst_0</text><text x="54" y="292" class="muted">오프셋 0</text>
    <text x="358" y="324" class="value">아직 저장 전</text><text x="654" y="280" class="value">[0]</text>
    <text x="36" y="490" class="label">1 / 6: 정수 상수 0을 피연산자 스택에 넣는다.</text>
  </g>
  <g class="scene s1">
    <text x="54" y="242" class="mono">istore_1</text><text x="54" y="292" class="muted">오프셋 1</text>
    <text x="358" y="324" class="value">0</text><text x="654" y="280" class="value">[ ]</text>
    <text x="654" y="329" class="muted">스택에서 꺼냄</text>
    <text x="36" y="490" class="label">2 / 6: 꺼낸 값을 지역변수 슬롯 1에 저장한다.</text>
  </g>
  <g class="scene s2">
    <text x="54" y="242" class="mono">iload_1</text><text x="54" y="292" class="muted">오프셋 2</text>
    <text x="358" y="324" class="value">0</text><text x="654" y="280" class="value">[0]</text>
    <text x="36" y="490" class="label">3 / 6: 슬롯 1의 값을 피연산자 스택에 복사한다.</text>
  </g>
  <g class="scene s3">
    <text x="54" y="242" class="mono">bipush 10</text><text x="54" y="292" class="muted">오프셋 3</text>
    <text x="358" y="324" class="value">0</text><text x="654" y="280" class="value">[0, 10]</text>
    <text x="36" y="490" class="label">4 / 6: 비교할 정수 10을 스택의 맨 위에 넣는다.</text>
  </g>
  <g class="scene s4">
    <text x="54" y="242" class="mono">if_icmpge 22</text><text x="54" y="292" class="muted">오프셋 5</text>
    <text x="358" y="324" class="value">0</text><text x="654" y="280" class="value">[ ]</text>
    <text x="654" y="329" class="muted">두 값을 꺼내 비교</text>
    <text x="36" y="490" class="label">5 / 6: 0 ≥ 10은 거짓이므로 다음 명령을 실행한다.</text>
  </g>
  <g class="scene s5">
    <text x="54" y="242" class="mono">iinc 1, 1</text><text x="54" y="292" class="muted">오프셋 16</text>
    <text x="358" y="324" class="value">0 → 1</text><text x="654" y="280" class="value">[ ]</text>
    <text x="654" y="329" class="muted">변화 없음</text>
    <text x="36" y="490" class="label">6 / 6: 출력 호출이 끝난 뒤, 슬롯 1을 직접 증가시킨다.</text>
  </g>
  <path d="M36 528H924" stroke="#d6deeb"/>
  <text x="36" y="565" class="muted">출력 호출 구간은 생략했다. iinc는 피연산자 스택을 사용하지 않는다.</text>
  <text x="36" y="596" class="muted">명령과 상태의 관계를 보여 주는 개념도이며, 실행 속도를 나타내지 않는다.</text>
</svg>
