<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 425" role="img" aria-labelledby="title desc">
  <title id="title">같은 호출 위치를 두 JVM이 컴파일한 결과</title>
  <desc id="desc">FeeDemo.quote의 바이트코드 오프셋 2에 FeePolicy.fee 인터페이스 호출이 있다. 두 JVM 모두 레벨 3에서는 그 구현을 인라인하지 않았다. 레벨 4에서 정률 수수료만 받은 JVM은 같은 위치에 RateFee.fee를 인라인했고, 정액 수수료만 받은 JVM은 FlatFee.fee를 인라인했다. 두 로그의 @ 2가 바이트코드의 위치 2를 가리킨다.</desc>
  <style>
    text { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #1c2738; }
    .title { font-size: 24px; font-weight: 750; letter-spacing: -.7px; }
    .label { font-size: 18px; font-weight: 600; fill: #40576a; }
    .code text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 20px; }
    .offset { font-weight: 700; fill: #194f86; }
    .code .result { font-size: 18.5px; font-weight: 650; fill: #175f56; }
    .note { font-size: 17px; fill: #43576a; }
  </style>
  <rect width="500" height="425" fill="#fff"/>
  <text x="20" y="35" class="title">같은 호출 위치를 두 JVM이 컴파일한 결과</text>

  <rect x="19" y="55" width="462" height="82" rx="9" fill="#f4f7fb" stroke="#c9d6e3"/>
  <text x="34" y="82" class="label">FeeDemo.quote의 바이트코드</text>
  <rect x="33" y="96" width="38" height="28" rx="5" fill="#dceafe"/>
  <g class="code">
    <text x="39" y="117" class="offset">2:</text>
    <text x="82" y="117">invokeinterface</text>
    <text x="276" y="117">FeePolicy.fee</text>
  </g>

  <text x="20" y="170" class="note">레벨 3에서는 두 JVM 모두 이 호출을 인라인하지 않았다.</text>
  <path d="M29 185V342 M29 223H47 M29 342H47" fill="none" stroke="#91a5b4" stroke-width="2"/>

  <rect x="48" y="190" width="433" height="87" rx="9" fill="#f5faf8" stroke="#bfd6cc"/>
  <text x="63" y="219" class="label">정률 수수료만 호출한 JVM · 레벨 4</text>
  <rect x="63" y="234" width="49" height="28" rx="5" fill="#dceafe"/>
  <g class="code">
    <text x="69" y="255" class="offset">@ 2</text>
    <text x="126" y="255">RateFee::fee</text>
    <text x="297" y="255" class="result">inline (hot)</text>
  </g>

  <rect x="48" y="308" width="433" height="87" rx="9" fill="#f5faf8" stroke="#bfd6cc"/>
  <text x="63" y="337" class="label">정액 수수료만 호출한 JVM · 레벨 4</text>
  <rect x="63" y="352" width="49" height="28" rx="5" fill="#dceafe"/>
  <g class="code">
    <text x="69" y="373" class="offset">@ 2</text>
    <text x="126" y="373">FlatFee::fee</text>
    <text x="297" y="373" class="result">inline (hot)</text>
  </g>
</svg>
