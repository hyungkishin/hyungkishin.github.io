<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">실행 프로파일과 가정 무효화에 따른 JIT 실행 경로</title>
  <desc id="desc">프로파일 수집 뒤 컴파일한 기계어를 실행한다. 전제가 무효화된 경우 deoptimization으로 실행 상태를 복원하고 이어서 실행한다. 새 프로파일에 따라 재컴파일할 수 있다. 화살표는 가능한 전환 순서이며 실제 측정 시간을 표현하지 않는다. 애니메이션이 꺼져도 모든 단계와 조건이 표시된다.</desc>
  <style>
    text { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #1c2738; font-size: 22px; }
    .heading { font-size: 32px; font-weight: 750; }
    .label { font-size: 24px; font-weight: 700; }
    .muted { font-size: 20px; fill: #58677b; }
    .box { fill: #f4f7fc; stroke: #cdd8e8; stroke-width: 2; }
    .conditional { fill: #fff5ec; stroke: #e9b783; stroke-width: 2; }
    .focus { fill: none; stroke: #2862ce; stroke-width: 4; opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .focus { animation: focus 18s linear infinite; }
      .f1 { animation-delay: -15s; }
      .f2 { animation-delay: -12s; }
      .f3 { animation-delay: -9s; }
      .f4 { animation-delay: -6s; }
      .f5 { animation-delay: -3s; }
    }
    @keyframes focus { 0%, 13% { opacity: 1; } 16.66%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .focus { animation: none; opacity: 0; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1L10 6L1 11" fill="none" stroke="#7b8da6" stroke-width="2"/></marker>
  </defs>
  <rect width="960" height="650" rx="24" fill="#fff"/>
  <text x="36" y="55" class="heading">실행 중 바뀔 수 있는 컴파일 전제</text>
  <text x="36" y="92" class="muted">HotSpot에서 가능한 전환 경로: 세부 컴파일 단계는 생략</text>
  <g fill="none" stroke="#7b8da6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M308 208H344"/>
    <path d="M624 208H660"/>
    <path d="M802 278V374"/>
    <path d="M664 448H628"/>
    <path d="M348 448H312"/>
  </g>
  <rect x="32" y="138" width="276" height="140" rx="18" class="box"/>
  <rect x="348" y="138" width="276" height="140" rx="18" class="box"/>
  <rect x="664" y="138" width="264" height="140" rx="18" class="box"/>
  <rect x="664" y="378" width="264" height="140" rx="18" class="conditional"/>
  <rect x="348" y="378" width="276" height="140" rx="18" class="box"/>
  <rect x="32" y="378" width="276" height="140" rx="18" class="box"/>
  <rect x="32" y="138" width="276" height="140" rx="18" class="focus f0"/>
  <rect x="348" y="138" width="276" height="140" rx="18" class="focus f1"/>
  <rect x="664" y="138" width="264" height="140" rx="18" class="focus f2"/>
  <rect x="664" y="378" width="264" height="140" rx="18" class="focus f3"/>
  <rect x="348" y="378" width="276" height="140" rx="18" class="focus f4"/>
  <rect x="32" y="378" width="276" height="140" rx="18" class="focus f5"/>
  <text x="54" y="182" class="label">1. 프로파일 수집</text>
  <text x="54" y="220" class="muted">호출 타입·실행 경로</text>
  <text x="54" y="252" class="muted">빈도 등의 정보</text>
  <text x="370" y="182" class="label">2. JIT 컴파일</text>
  <text x="370" y="220" class="muted">인라이닝 등 적용</text>
  <text x="370" y="252" class="muted">전제에 맞춘 코드 생성</text>
  <text x="686" y="182" class="label">3. 기계어 실행</text>
  <text x="686" y="220" class="muted">가드·의존 관계로</text>
  <text x="686" y="252" class="muted">전제를 확인</text>
  <text x="36" y="328" class="muted">전제가 유지되면 기계어 실행을 이어간다.</text>
  <text x="585" y="329" class="muted">전제가 무효화된 경우</text>
  <text x="686" y="422" class="label">4. deoptimization</text>
  <text x="686" y="460" class="muted">실행 상태 복원</text>
  <text x="686" y="492" class="muted">인터프리터 등으로 전환</text>
  <text x="370" y="422" class="label">5. 실행·정보 수집</text>
  <text x="370" y="460" class="muted">프로그램 의미를 유지</text>
  <text x="370" y="492" class="muted">새 실행 경로의 정보</text>
  <text x="54" y="422" class="label">6. 재컴파일 가능</text>
  <text x="54" y="460" class="muted">새 프로파일에 맞춰</text>
  <text x="54" y="492" class="muted">컴파일 여부를 판단</text>
  <path d="M36 560H924" stroke="#d6deeb"/>
  <text x="36" y="597" class="muted">전환 간격과 속도는 실측값이 아니다. 모든 메서드가 이 경로를 거치지는 않는다.</text>
  <text x="36" y="628" class="muted">새 타입을 만났을 때의 동작은 생성한 코드와 가드에 따라 달라진다.</text>
</svg>
