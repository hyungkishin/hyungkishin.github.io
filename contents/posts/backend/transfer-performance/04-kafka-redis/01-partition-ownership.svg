<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="partition-title partition-desc">
  <title id="partition-title">키별 기록 순서와 컨슈머의 파티션 담당</title>
  <desc id="partition-desc">계좌 A의 이벤트 A1과 A2는 파티션 P0에 오프셋 40과 41로 기록되고 컨슈머 1이 읽는다. 계좌 B의 B1과 B2는 P1의 오프셋 8과 9로 기록되고 컨슈머 2가 읽는다. 두 컨슈머는 같은 일반 컨슈머 그룹이다. 서로 다른 파티션 사이의 전체 순서는 보장하지 않는다.</desc>
  <defs>
    <marker id="partition-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text{font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;font-size:22px}
    .caption{fill:#475569;font-size:20px}
    .title{font-size:30px;font-weight:700}
    .heading{font-size:24px;font-weight:700}
    .blue{fill:#1d4ed8}.green{fill:#047857}
  </style>
  <rect x="1" y="1" width="958" height="598" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text class="title" x="40" y="52">같은 키의 기록은 한 파티션에서 이어진다</text>
  <text class="caption" x="40" y="88">A와 B가 서로 다른 파티션에 매핑된 예: 기록 순서와 발생 시각은 별개</text>

  <rect x="40" y="207" width="180" height="188" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="130" y="249" text-anchor="middle">프로듀서</text>
  <text x="130" y="293" text-anchor="middle" class="blue">계좌 A: A1, A2</text>
  <text x="130" y="333" text-anchor="middle" class="green">계좌 B: B1, B2</text>
  <text class="caption" x="130" y="370" text-anchor="middle">키로 목적지 선택</text>

  <path d="M220 269 H255 V219 H296" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#partition-arrow)"/>
  <path d="M220 333 H255 V406 H296" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#partition-arrow)"/>

  <rect x="306" y="146" width="300" height="146" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading blue" x="330" y="183">파티션 P0</text>
  <path d="M330 204 H582" stroke="#bfdbfe" stroke-width="2"/>
  <text x="344" y="239" class="blue">A1</text>
  <text x="445" y="239" class="blue">→</text>
  <text x="533" y="239" class="blue">A2</text>
  <text class="caption" x="344" y="272">offset 40</text>
  <text class="caption" x="505" y="272">41</text>

  <rect x="306" y="333" width="300" height="146" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text class="heading green" x="330" y="370">파티션 P1</text>
  <path d="M330 391 H582" stroke="#a7f3d0" stroke-width="2"/>
  <text x="344" y="426" class="green">B1</text>
  <text x="445" y="426" class="green">→</text>
  <text x="533" y="426" class="green">B2</text>
  <text class="caption" x="344" y="459">offset 8</text>
  <text class="caption" x="505" y="459">9</text>

  <rect x="704" y="126" width="216" height="372" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="caption" x="812" y="158" text-anchor="middle">같은 컨슈머 그룹</text>
  <rect x="728" y="183" width="168" height="99" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="812" y="224" text-anchor="middle">컨슈머 1</text>
  <text class="caption" x="812" y="258" text-anchor="middle">P0 담당</text>
  <rect x="728" y="361" width="168" height="99" rx="14" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text class="heading" x="812" y="402" text-anchor="middle">컨슈머 2</text>
  <text class="caption" x="812" y="436" text-anchor="middle">P1 담당</text>
  <path d="M606 233 H716" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#partition-arrow)"/>
  <path d="M606 410 H716" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#partition-arrow)"/>

  <text x="40" y="542" font-weight="600">일반 그룹: 한 파티션을 같은 시점에 한 컨슈머가 담당</text>
  <text class="caption" x="40" y="576">파티션 간 전체 순서 없음 · 복제본 수를 늘려도 파티션 수는 그대로</text>
</svg>
