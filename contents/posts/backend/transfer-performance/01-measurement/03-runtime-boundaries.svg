<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">VPC, EC2, 컨테이너와 송금 프로세스의 경계</title>
  <desc id="desc">하나의 VPC 안에 로드밸런서와 두 EC2가 있다. 각 EC2는 자신의 호스트 OS에서 컨테이너를 실행하고 컨테이너 안에서 송금 앱의 JVM 프로세스가 실행된다. 로드밸런서는 같은 송금 서비스의 두 복제본으로 요청을 나눈다. 점선 영역은 함께 요청을 처리하는 서비스 인스턴스의 논리적 묶음이며 VPC 네트워크 경계와 다르다. Kubernetes 없이 EC2와 Docker를 사용하는 설명용 구성이다. 서브넷과 가용 영역, 보안 설정은 생략했다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647a93"/></marker></defs>
  <style>
    text { font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; fill: #172338; }
    .heading { font-size: 32px; font-weight: 750; }
    .label { font-size: 25px; font-weight: 700; }
    .body { font-size: 24px; }
    .small { font-size: 22px; }
    .muted { fill: #536477; }
  </style>
  <rect width="960" height="760" rx="18" fill="#fff"/>
  <text x="42" y="57" class="heading">네트워크 안에 호스트와 실행 프로세스가 있다</text>
  <text x="42" y="97" class="body muted">Kubernetes 없이 EC2와 Docker로 송금 서비스를 복제하는 예</text>

  <rect x="35" y="130" width="890" height="515" rx="18" fill="#fbfcfe" stroke="#a9b9cd" stroke-width="2"/>
  <text x="59" y="169" class="label">VPC: 네트워크 경계</text>

  <rect x="382" y="193" width="196" height="78" rx="13" fill="#eef6ff" stroke="#8cb3e3" stroke-width="2"/>
  <text x="480" y="241" text-anchor="middle" class="label">로드밸런서</text>
  <path d="M 480 274 V 296 H 267 V 352" fill="none" stroke="#647a93" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 480 296 H 692 V 352" fill="none" stroke="#647a93" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="598" y="242" class="small muted">요청 분배</text>

  <rect x="64" y="322" width="832" height="291" rx="15" fill="none" stroke="#9aaec4" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="85" y="365" width="365" height="194" rx="14" fill="#f0f4f9" stroke="#aebfd3" stroke-width="2"/>
  <text x="108" y="402" class="label">EC2 A: 호스트 OS</text>
  <rect x="110" y="425" width="315" height="108" rx="12" fill="#edf8f2" stroke="#8fc6a8" stroke-width="2"/>
  <text x="132" y="462" class="small muted">컨테이너</text>
  <text x="132" y="503" class="label">송금 JVM 프로세스</text>

  <rect x="510" y="365" width="365" height="194" rx="14" fill="#f0f4f9" stroke="#aebfd3" stroke-width="2"/>
  <text x="533" y="402" class="label">EC2 B: 호스트 OS</text>
  <rect x="535" y="425" width="315" height="108" rx="12" fill="#edf8f2" stroke="#8fc6a8" stroke-width="2"/>
  <text x="557" y="462" class="small muted">컨테이너</text>
  <text x="557" y="503" class="label">송금 JVM 프로세스</text>

  <text x="85" y="592" class="small muted">점선: 같은 송금 서비스의 실행 인스턴스를 함께 운영하는 논리적 묶음</text>
  <text x="42" y="690" class="body">컨테이너는 실행 중인 호스트의 커널을 공유한다.</text>
  <text x="42" y="729" class="small muted">VPC에 함께 있다는 사실만으로 같은 서비스 클러스터가 되지는 않는다.</text>
</svg>
