<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">같은 변경을 두 감속 방식으로 비교한 결과</title>
  <desc id="desc">Lantern은 FCP 차이를 899ms로 추정해 폰트를 원인으로 오판하게 했다. 적용형 감속에서는 차이가 78ms였고 첫 페인트가 폰트 도착보다 2,335ms 빨랐다.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#fcfcfb;--panel:#f5f6f7;--line:#c9c9c2;--ink:#1a1a1a;--sub:#76766f;--bad:#dc6648;--bad-soft:#fff0eb;--good:#0f8f83;--good-soft:#eaf8f5;--grid:#ecece7}
    @media(prefers-color-scheme:dark){:root{--bg:#111;--panel:#1b1b1a;--line:#44443f;--ink:#f3f3ef;--sub:#aaa79e;--bad:#f08468;--bad-soft:#2b1d19;--good:#42cbbb;--good-soft:#142724;--grid:#20201e}}
    text{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
    .panel{fill:var(--panel);stroke:var(--line)}.node{stroke-width:1.5}.muted{fill:var(--sub)}.edge{fill:none;stroke-width:2}.edge.bad{stroke:var(--bad)}.edge.good{stroke:var(--good)}
    .token{filter:drop-shadow(0 0 4px currentColor)}
    @media(prefers-reduced-motion:reduce){.token{display:none}}
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)" stroke-width=".6"/></pattern>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="var(--bad)"/></marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="var(--good)"/></marker>
  </defs>
  <rect width="760" height="330" rx="16" fill="var(--bg)"/>
  <rect width="760" height="330" rx="16" fill="url(#grid)"/>

  <text x="28" y="34" font-size="18" font-weight="700">899ms를 사용자 지연으로 읽으면 생기는 오판</text>
  <text x="28" y="55" class="muted" font-size="12">같은 빌드 · 다른 감속 방식 · 같은 FCP 이름</text>

  <rect class="panel" x="24" y="76" width="712" height="96" rx="13"/>
  <text x="42" y="99" class="muted" font-size="11" font-weight="700">LANTERN 시뮬레이션</text>
  <rect class="node" x="42" y="112" width="180" height="44" rx="9" fill="var(--bad-soft)" stroke="var(--bad)"/>
  <text x="56" y="130" font-size="12" font-weight="700">Simulated FCP</text><text x="56" y="147" class="muted" font-size="11">1,360 → 2,259ms · +899ms</text>
  <path id="bad-path" class="edge bad" d="M222 134H516" marker-end="url(#arrow-bad)"/>
  <rect x="305" y="119" width="126" height="24" rx="12" fill="var(--bg)"/><text x="368" y="135" fill="var(--bad)" font-size="11" text-anchor="middle">숫자만 비교</text>
  <rect class="node" x="516" y="112" width="198" height="44" rx="9" fill="var(--bad-soft)" stroke="var(--bad)"/>
  <text x="530" y="130" font-size="12" font-weight="700">폰트가 막았다고 단정</text><text x="530" y="147" class="muted" font-size="11">추정값에서 고른 원인</text>
  <circle class="token" r="5" fill="var(--bad)" color="var(--bad)"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0s"><mpath href="#bad-path"/></animateMotion></circle>

  <rect class="panel" x="24" y="188" width="712" height="116" rx="13"/>
  <text x="42" y="211" class="muted" font-size="11" font-weight="700">적용형 감속</text>
  <rect class="node" x="42" y="230" width="180" height="54" rx="9" fill="var(--good-soft)" stroke="var(--good)"/>
  <text x="56" y="250" font-size="12" font-weight="700">Applied FCP</text><text x="56" y="268" class="muted" font-size="11">1,627 → 1,705ms · +78ms</text>
  <path id="good-path" class="edge good" d="M222 257H516" marker-end="url(#arrow-good)"/>
  <rect x="294" y="242" width="148" height="24" rx="12" fill="var(--bg)"/><text x="368" y="258" fill="var(--good)" font-size="11" text-anchor="middle">도착 순서 확인</text>
  <rect class="node" x="516" y="230" width="198" height="54" rx="9" fill="var(--good-soft)" stroke="var(--good)"/>
  <text x="530" y="250" font-size="12" font-weight="700">첫 페인트가 먼저</text><text x="530" y="268" class="muted" font-size="11">1,705ms → 폰트 4,040ms</text>
  <circle class="token" r="5" fill="var(--good)" color="var(--good)"><animateMotion dur="2.8s" repeatCount="indefinite" begin=".7s"><mpath href="#good-path"/></animateMotion></circle>
</svg>
