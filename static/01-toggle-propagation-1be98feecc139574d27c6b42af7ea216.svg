<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="430" rx="20" fill="url(#bg)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1e293b">토글 한 번의 파급</text>
  <text x="40" y="78" font-size="14" fill="#64748b">클릭 하나가 어디까지 번지고 어디서 멈추는지</text>

  <!-- 흐름선 -->
  <path id="p1" d="M260,222 C310,222 320,210 366,210" fill="none" stroke="#0891b2" stroke-opacity="0.22" stroke-width="1.5"/>
  <path id="p2" d="M560,185 C605,185 618,140 656,140" fill="none" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.5"/>
  <path id="p3" d="M560,235 C605,235 618,300 652,300" fill="none" stroke="#64748b" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- 카드 A -->
  <g>
    <rect x="50" y="120" width="210" height="160" rx="16" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.14"/>
    <text x="70" y="152" font-size="15" font-weight="600" fill="#334155">카드 A</text>
    <text x="70" y="174" font-size="13" fill="#64748b">상품 p1</text>
    <rect x="70" y="200" width="170" height="44" rx="10" fill="#0891b2" fill-opacity="0.14" stroke="#0891b2" stroke-opacity="0.8"/>
    <text x="155" y="228" font-size="15" font-weight="600" fill="#0e7490" text-anchor="middle">담기</text>
    <circle cx="155" cy="222" r="10" fill="none" stroke="#0891b2" stroke-width="2">
      <animate attributeName="r" values="10;10;36;10" keyTimes="0;0.02;0.12;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0.9;0;0" keyTimes="0;0.02;0.12;1" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- store -->
  <g>
    <rect x="370" y="150" width="190" height="120" rx="16" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="stroke-opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.28;0.33;0.40;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.5;1.5;3;1.5;1.5" keyTimes="0;0.28;0.33;0.40;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="465" y="182" font-size="15" font-weight="600" fill="#8b5cf6" text-anchor="middle">store</text>
    <text x="465" y="218" font-size="14" fill="#1e293b" text-anchor="middle" font-family="monospace">
      cartIds: [ ]
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.30;0.34;0.92;0.96;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="465" y="218" font-size="14" fill="#0e7490" text-anchor="middle" font-family="monospace" opacity="0">
      cartIds: [ 'p1' ]
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.34;0.92;0.96;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="465" y="248" font-size="11" fill="#64748b" text-anchor="middle">저장은 ID뿐</text>
  </g>

  <!-- 헤더 -->
  <g>
    <rect x="660" y="95" width="200" height="90" rx="16" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.14"/>
    <text x="680" y="127" font-size="15" font-weight="600" fill="#334155">헤더</text>
    <text x="680" y="160" font-size="15" fill="#1e293b">
      장바구니 0
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.60;0.63;0.92;0.96;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="680" y="160" font-size="15" font-weight="700" fill="#d97706" opacity="0">
      장바구니 1
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.63;0.92;0.96;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="font-size" values="15;15;19;15;15" keyTimes="0;0.60;0.65;0.72;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="680" y="178" font-size="11" fill="#64748b">length만 구독</text>
  </g>

  <!-- 카드 B -->
  <g opacity="0.8">
    <rect x="660" y="250" width="200" height="120" rx="16" fill="#0f172a" fill-opacity="0.04" stroke="#0f172a" stroke-opacity="0.10"/>
    <text x="680" y="282" font-size="15" font-weight="600" fill="#64748b">카드 B</text>
    <text x="680" y="304" font-size="13" fill="#64748b">상품 p2</text>
    <text x="680" y="344" font-size="13" fill="#64748b" opacity="0">
      리렌더 없음
      <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.52;0.58;0.92;0.96;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- selector 거름막 -->
  <g>
    <rect x="572" y="252" width="76" height="26" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
    <text x="610" y="269" font-size="11" fill="#64748b" text-anchor="middle">selector</text>
    <text x="610" y="244" font-size="13" fill="#e11d48" text-anchor="middle" opacity="0">
      ✕
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.50;0.54;0.60;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- 이동 점 -->
  <circle r="6" fill="#0891b2" filter="url(#glow)" opacity="0">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.12;0.28;1" calcMode="linear">
      <mpath href="#p1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.26;0.28;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#7c3aed" filter="url(#glow)" opacity="0">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.44;0.58;1" calcMode="linear">
      <mpath href="#p2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.56;0.58;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#64748b" opacity="0">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;0.45;0.45" keyTimes="0;0.44;0.52;1" calcMode="linear">
      <mpath href="#p3"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.44;0.50;0.54;1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
