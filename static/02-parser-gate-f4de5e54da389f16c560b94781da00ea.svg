<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="400" rx="20" fill="url(#bg2)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1e293b">parser는 관문이다</text>
  <text x="40" y="78" font-size="14" fill="#64748b">거절된 값은 사라지지 않는다. 기본값 1이 되어 지나간다</text>

  <!-- 레인: 관문 앞은 실선, 관문 뒤는 확정된 구간 -->
  <g stroke-linecap="round">
    <line x1="205" y1="150" x2="432" y2="150" stroke="#0f172a" stroke-opacity="0.16" stroke-width="1.5"/>
    <line x1="205" y1="215" x2="432" y2="215" stroke="#0f172a" stroke-opacity="0.16" stroke-width="1.5"/>
    <line x1="205" y1="280" x2="432" y2="280" stroke="#0f172a" stroke-opacity="0.16" stroke-width="1.5"/>
    <line x1="528" y1="150" x2="684" y2="150" stroke="#059669" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="528" y1="215" x2="684" y2="215" stroke="#d97706" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="528" y1="280" x2="684" y2="280" stroke="#d97706" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- 관문 -->
  <rect x="440" y="105" width="88" height="215" rx="14" fill="#0891b2" fill-opacity="0.07" stroke="#0891b2" stroke-opacity="0.55" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;1;0.55;0.55" keyTimes="0;0.30;0.35;0.39;0.43;0.47;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;1.5;3;1.5;3;1.5;1.5" keyTimes="0;0.30;0.35;0.39;0.43;0.47;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="484" y="96" font-size="13" fill="#0e7490" text-anchor="middle" font-family="monospace">parseAsPageNumber</text>

  <!-- 통과 칩 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;225,0;225,0;640,0;640,0" keyTimes="0;0.06;0.32;0.42;0.66;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0;1;1" keyTimes="0;0.60;0.64;0.68;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
    <rect x="60" y="131" width="140" height="38" rx="10" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.8"/>
    <text x="130" y="155" font-size="13" fill="#047857" text-anchor="middle" font-family="monospace">?page=3</text>
  </g>

  <!-- 거절 칩: 1e20 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;225,0;225,0" keyTimes="0;0.06;0.32;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;0.36;0.44;0.48;0.96;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-6,0;6,0;-4,0;0,0;0,0" keyTimes="0;0.34;0.36;0.38;0.40;0.42;1" dur="6s" repeatCount="indefinite"/>
      <rect x="60" y="196" width="140" height="38" rx="10" fill="#e11d48" fill-opacity="0.10" stroke="#e11d48" stroke-opacity="0.8"/>
      <text x="130" y="220" font-size="13" fill="#f43f5e" text-anchor="middle" font-family="monospace">?page=1e20</text>
    </g>
  </g>

  <!-- 거절 칩: abc -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;225,0;225,0" keyTimes="0;0.09;0.34;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;0.39;0.47;0.51;0.96;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-6,0;6,0;-4,0;0,0;0,0" keyTimes="0;0.37;0.39;0.41;0.43;0.45;1" dur="6s" repeatCount="indefinite"/>
      <rect x="60" y="261" width="140" height="38" rx="10" fill="#e11d48" fill-opacity="0.10" stroke="#e11d48" stroke-opacity="0.8"/>
      <text x="130" y="285" font-size="13" fill="#f43f5e" text-anchor="middle" font-family="monospace">?page=abc</text>
    </g>
  </g>

  <!-- 기본값으로 바뀌어 관문을 통과하는 칩 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.50;0.64;0.68;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;150,0;150,0" keyTimes="0;0.48;0.66;1" dur="6s" repeatCount="indefinite"/>
    <rect x="540" y="199" width="52" height="32" rx="8" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.9" filter="url(#glow2)"/>
    <text x="566" y="220" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle" font-family="monospace">1</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.53;0.66;0.70;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;150,0;150,0" keyTimes="0;0.51;0.68;1" dur="6s" repeatCount="indefinite"/>
    <rect x="540" y="264" width="52" height="32" rx="8" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-opacity="0.9" filter="url(#glow2)"/>
    <text x="566" y="285" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle" font-family="monospace">1</text>
  </g>

  <!-- 쿼리 조건: 정지 상태에서도 결과가 읽히도록 항상 그려 두고 도착 시점에만 진해진다 -->
  <g>
    <rect x="684" y="100" width="186" height="232" rx="16" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.14"/>
    <text x="777" y="128" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">쿼리 조건</text>

    <g opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.64;0.68;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
      <text x="708" y="156" font-size="14" fill="#047857" font-family="monospace">page: 3</text>
    </g>

    <g opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.66;0.70;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
      <text x="708" y="221" font-size="14" fill="#b45309" font-family="monospace">page: 1</text>
      <text x="790" y="221" font-size="11" fill="#64748b">기본값</text>
    </g>

    <g opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.68;0.72;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
      <text x="708" y="286" font-size="14" fill="#b45309" font-family="monospace">page: 1</text>
      <text x="790" y="286" font-size="11" fill="#64748b">기본값</text>
    </g>
  </g>

  <text x="40" y="368" font-size="13" fill="#64748b">거절된 값은 API로 가지 않는다. 화면은 1페이지에서 다시 시작한다.</text>
</svg>
