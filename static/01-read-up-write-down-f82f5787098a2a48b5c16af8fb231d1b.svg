<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="ptbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="ptglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="440" rx="20" fill="url(#ptbg)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1e293b">읽기는 위로 올라가고 쓰기는 그 자리에 남는다</text>
  <text x="40" y="78" font-size="14" fill="#64748b" font-family="monospace">child.retry++  한 줄이 서로 다른 두 객체를 건드린다</text>

  <!-- base -->
  <rect x="520" y="128" width="320" height="96" rx="16" fill="#a855f7" fill-opacity="0.07" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="680" y="156" font-size="13" fill="#7e22ce" text-anchor="middle" font-family="monospace">base (프로토타입)</text>
  <rect x="548" y="168" width="264" height="40" rx="10" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.45"/>
  <text x="680" y="194" font-size="15" fill="#7e22ce" text-anchor="middle" font-family="monospace">retry: 3</text>

  <!-- 프로토타입 링크 -->
  <path d="M 300 224 L 300 268 L 680 268 L 680 232" fill="none" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="5 5"/>
  <text x="470" y="288" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="monospace">[[Prototype]]</text>

  <!-- child -->
  <rect x="140" y="128" width="320" height="96" rx="16" fill="#0891b2" fill-opacity="0.06" stroke="#0891b2" stroke-opacity="0.35"/>
  <text x="300" y="156" font-size="13" fill="#0e7490" text-anchor="middle" font-family="monospace">child</text>
  <text x="300" y="196" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="monospace" opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.62;0.68;0.94;1" dur="11s" repeatCount="indefinite"/>
    자기 프로퍼티 없음
  </text>

  <!-- 1단계: 읽기 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.34;0.40;1" dur="11s" repeatCount="indefinite"/>
    <text x="300" y="336" font-size="14" fill="#0e7490" text-anchor="middle" font-family="monospace">1. 읽기: child 에 없음</text>
    <text x="680" y="336" font-size="14" fill="#7e22ce" text-anchor="middle" font-family="monospace">체인을 올라가 3 을 찾는다</text>
  </g>
  <circle r="6" fill="#0891b2" filter="url(#ptglow)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.10;0.13;0.28;0.32;1" dur="11s" repeatCount="indefinite"/>
    <animateMotion path="M 300 224 L 300 268 L 680 268 L 680 232" keyPoints="0;0;1;1" keyTimes="0;0.13;0.28;1" dur="11s" repeatCount="indefinite" calcMode="linear"/>
  </circle>

  <!-- 2단계: 계산 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.45;0.56;0.60;1" dur="11s" repeatCount="indefinite"/>
    <rect x="330" y="356" width="240" height="44" rx="12" fill="#fbbf24" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="450" y="383" font-size="14" fill="#b45309" text-anchor="middle" font-family="monospace">2. 3 + 1 = 4</text>
  </g>

  <!-- 3단계: 쓰기 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.94;1" dur="11s" repeatCount="indefinite"/>
    <rect x="168" y="168" width="264" height="40" rx="10" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-opacity="0.7" filter="url(#ptglow)"/>
    <text x="300" y="194" font-size="15" fill="#047857" text-anchor="middle" font-family="monospace">retry: 4</text>
    <text x="300" y="336" font-size="14" fill="#047857" text-anchor="middle" font-family="monospace">3. 쓰기: child 에 새 슬롯</text>
    <text x="680" y="336" font-size="14" fill="#be123c" text-anchor="middle" font-family="monospace">base.retry 는 3 그대로</text>
    <text x="450" y="388" font-size="13" fill="#64748b" text-anchor="middle">읽은 곳과 쓴 곳이 다르다. 이후의 읽기는 base 까지 올라가지 않는다.</text>
  </g>
</svg>
