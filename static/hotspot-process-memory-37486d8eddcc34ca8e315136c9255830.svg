<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 307"
     role="img" aria-labelledby="memory-title memory-desc"
     font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" fill="#1b1b1b">
  <title id="memory-title">HotSpot 프로세스의 가상 주소 공간</title>
  <desc id="memory-desc">대표적인 메모리 용도와 각 예를 짝지었다. 자바 힙에는 객체와 배열이 있고, 메타스페이스에는 클래스 메타데이터가 있다. 코드 캐시에는 JIT가 생성한 기계어 등이 있다. 플랫폼 스레드의 호출 프레임은 스레드 스택에 있다. GC가 쓰는 마킹 비트맵과 공유 라이브러리 매핑도 이 프로세스의 주소 공간에 있다. 행의 배치와 길이는 가상 주소의 순서나 크기를 나타내지 않는다.</desc>
  <rect width="400" height="307" fill="#fff"/>

  <text x="10" y="25" font-size="19" font-weight="650">HotSpot 프로세스의 가상 주소 공간</text>
  <path d="M9 37 Q198 36.6 392 37" fill="none" stroke="#333" stroke-width="1.2"/>

  <g font-size="16" fill="#555">
    <text x="27" y="63">대표 용도</text>
    <text x="177" y="63">메모리에 놓이는 것</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M18 76h-8q-.7 93 0 191h8" stroke="#333" stroke-width="1.5"/>
    <path d="M26 104h365m-365 33h365m-365 33h365m-365 33h365m-365 33h365"
          stroke="#ccc" stroke-width=".8"/>
  </g>
  <g font-size="18" font-weight="600">
    <text x="27" y="96">자바 힙</text>
    <text x="27" y="129">메타스페이스</text>
    <text x="27" y="162">코드 캐시</text>
    <text x="27" y="195">스레드 스택</text>
    <text x="27" y="228">GC 보조 자료</text>
    <text x="27" y="261">라이브러리 매핑</text>
  </g>
  <g font-size="17">
    <text x="177" y="96">객체와 배열</text>
    <text x="177" y="129">클래스 메타데이터</text>
    <text x="177" y="162">JIT가 생성한 기계어 등</text>
    <text x="177" y="195">플랫폼 스레드의 호출 프레임</text>
    <text x="177" y="228">마킹 비트맵 등</text>
    <text x="177" y="261">공유 라이브러리의 코드 등</text>
  </g>
  <path d="M9 275 Q196 274.6 392 275" fill="none" stroke="#555"/>
  <text x="10" y="298" fill="#555" font-size="16">주소 순서와 영역별 크기는 생략했다.</text>
</svg>
