<svg id="play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 374"
     role="img" aria-labelledby="arch-title arch-desc" fill="#161616"
     font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title id="arch-title">JVM의 실행 구조와 주문 객체의 할당</title>
  <desc id="arch-desc">클래스 파일을 읽는 클래스 로더, 런타임 데이터 영역, 실행 엔진과 JNI 및 네이티브 라이브러리의 관계를 보여준다. 런타임 데이터 영역에는 메서드 영역, 힙, JVM 스택, PC 레지스터와 구현에 따라 네이티브 메서드 스택이 있다. 그림이 나란히 있는 힙과 JVM 스택으로 다가간다. Checkout.createOrder()의 new 명령은 quantity 필드의 초기값이 0인 Order 객체를 힙에 할당하고 그 참조를 현재 프레임의 피연산자 스택에 올린다. 생성자는 아직 호출하기 전이다.</desc>
  <style>
    .box, .link, .hair { fill: none; stroke: #222; }
    .box { stroke-width: 1.55; }
    .link { stroke-width: 1.45; }
    .hair { stroke: #666; stroke-width: .85; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .detail, .allocated, .pre-note { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      svg:target .scene { transform-origin: 0 0; animation: zoom 3.1s cubic-bezier(.48,0,.22,1) 4.2s both; }
      svg:target .surroundings { animation: leave-view 2.4s ease 4.3s both; }
      svg:target .moving-title { animation: lift-title 1.9s ease 5.2s both; }
      svg:target .detail { animation: arrive 1s ease 6.2s both; }
      svg:target .allocated { animation: arrive .32s ease-out 8.8s both; }
      svg:target .note-rule, svg:target .pre-note { animation: leave-view 1s ease 6.2s both; }
      svg:target .still-note { display: none; }
      @keyframes zoom {
        from { transform: translate(0, 0) scale(1); }
        to { transform: translate(-280px, -290px) scale(2.60); }
      }
      @keyframes leave-view { from { opacity: 1; } to { opacity: 0; } }
      @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
      @keyframes lift-title { from { transform: translateY(0); } to { transform: translateY(-31px); } }
    }
    @media print {
      svg:target .scene, svg:target .surroundings, svg:target .moving-title,
      svg:target .detail, svg:target .allocated, svg:target .pre-note, svg:target .note-rule { animation: none; }
      svg:target .still-note { display: inline; }
    }
  </style>
  <defs>
    <clipPath id="visible-map"><rect x="3" y="0" width="494" height="318"/></clipPath>
    <marker id="arrow" orient="auto-start-reverse" markerUnits="userSpaceOnUse"
            viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9">
      <path d="m1 1 7 3.5L1 8" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
    <marker id="ref-arrow" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 5 5"
            refX="4.8" refY="2.5" markerWidth="5" markerHeight="5">
      <path d="m.7 .6 4.1 1.9L.7 4.4" fill="none" stroke="#222" stroke-width=".8"/>
    </marker>
  </defs>
  <rect width="500" height="374" fill="white"/>
  <g clip-path="url(#visible-map)">
    <g class="scene">
      <g class="surroundings">
        <text x="64" y="37" font-size="18" font-weight="550">클래스 파일</text>
        <path d="M165 31h37" class="link" marker-end="url(#arrow)"/>
        <rect x="210" y="11" width="132" height="42" class="box"/>
        <text x="276" y="38" font-size="18" font-weight="620" text-anchor="middle">클래스 로더</text>
        <path d="M276 54v25" class="link" marker-end="url(#arrow)"/>

        <rect x="6" y="86" width="488" height="158" fill="none" stroke="#555" stroke-width="1.45" stroke-dasharray="3 3"/>
        <text x="21" y="110" font-size="18" font-weight="650">런타임 데이터 영역</text>

        <rect x="15" y="123" width="85" height="103" class="box"/>
        <rect x="303" y="123" width="85" height="103" class="box"/>
        <rect x="399" y="123" width="85" height="103" class="box"/>
        <g font-size="17" text-anchor="middle" font-weight="550">
          <text x="57.5" y="170">메서드</text>
          <text x="57.5" y="192">영역</text>
          <text x="345.5" y="170">PC</text>
          <text x="345.5" y="192">레지스터</text>
          <text x="441.5" y="158">네이티브</text>
          <text x="441.5" y="180">메서드</text>
          <text x="441.5" y="202">스택*</text>
        </g>

        <!-- The execution engine connects to the perimeter of the whole runtime group. -->
        <path d="M66 247v23" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <rect x="8" y="277" width="117" height="37" class="box"/>
        <rect x="184" y="277" width="104" height="37" class="box"/>
        <rect x="346" y="277" width="146" height="37" class="box"/>
        <g font-size="16" font-weight="570" text-anchor="middle">
          <text x="66.5" y="302">실행 엔진</text>
          <text x="236" y="302">JNI</text>
          <text x="419" y="302">네이티브 라이브러리</text>
        </g>
        <path d="M131 295h47" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <path d="M294 295h46" class="link" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      </g>

      <rect x="111" y="123" width="85" height="103" class="box"/>
      <rect x="207" y="123" width="85" height="103" class="box"/>
      <g class="moving-title" text-anchor="middle" font-size="17" font-weight="580">
        <text x="153.5" y="181">힙</text>
        <text x="249.5" y="181">JVM 스택</text>
      </g>

      <g class="detail">
        <rect x="212" y="158" width="75" height="58" class="hair"/>
        <text x="216" y="168.5" font-size="8.5">현재 프레임</text>
        <text x="216" y="179.5" class="code" font-size="8.7">createOrder()</text>
        <path d="M212 185h75" class="hair"/>
        <text x="216" y="195.5" font-size="8.5">피연산자 스택</text>
      </g>
      <g class="allocated">
        <rect x="116" y="158" width="75" height="58" class="hair"/>
        <text x="121" y="174" class="code" font-size="13" font-weight="600">Order</text>
        <path d="M116 182h75" class="hair"/>
        <text x="121" y="196" class="code" font-size="8.4">int quantity</text>
        <text x="121" y="207" class="code" font-size="8.4">= 0</text>
        <text x="222" y="208" font-size="8.6">객체 참조</text>
        <circle cx="218" cy="205" r="1.35" fill="#202020"/>
        <path d="M218 205h-27" class="hair" marker-end="url(#ref-arrow)"/>
      </g>
    </g>
  </g>
  <path d="M10 325h480" class="hair note-rule"/>
  <g class="still-note" font-size="14">
    <text x="10" y="344" class="code">createOrder()</text>
    <text x="134" y="344">피연산자 스택</text>
    <path d="M227 339h39" class="link" marker-end="url(#arrow)"/>
    <text x="276" y="344" class="code">Order { quantity = 0 }</text>
    <text x="10" y="365" fill="#444">* 네이티브 메서드 스택은 JVM 구현에 따라 제공한다.</text>
  </g>
  <g class="pre-note" font-size="15" fill="#444">
    <text x="10" y="345">* 네이티브 메서드 스택은 JVM 구현에 따라 제공한다.</text>
  </g>
</svg>
