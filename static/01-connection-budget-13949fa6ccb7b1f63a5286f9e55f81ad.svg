<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, system-ui, sans-serif">
  <rect class="bg" x="0" y="0" width="640" height="340" fill="#ffffff"/>
  <text x="150" y="30" font-size="15" font-weight="700" fill="#1f2937">커넥션 예산: 파드 수를 곱해야 진짜 값이 된다</text>

  <!-- axis grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="52" x2="150" y2="292"/>
    <line x1="262" y1="52" x2="262" y2="292"/>
    <line x1="375" y1="52" x2="375" y2="292"/>
    <line x1="487" y1="52" x2="487" y2="292"/>
    <line x1="600" y1="52" x2="600" y2="292"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="150" y="308">0</text>
    <text x="262" y="308">450</text>
    <text x="375" y="308">900</text>
    <text x="487" y="308">1350</text>
    <text x="600" y="308">1800</text>
  </g>

  <!-- bars -->
  <!-- naive 430 -->
  <rect x="150" y="64" width="107" height="30" rx="4" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="146" y="84" font-size="12" fill="#4b5563" text-anchor="end">순진한 합</text>
  <text x="265" y="84" font-size="12" font-weight="700" fill="#991b1b">430 : 틀림</text>

  <!-- idle floor 620 -->
  <rect x="150" y="106" width="155" height="30" rx="4" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="146" y="126" font-size="12" fill="#4b5563" text-anchor="end">유휴 바닥</text>
  <text x="313" y="126" font-size="12" font-weight="700" fill="#4b5563">620 : 상시 점유</text>

  <!-- observed 810 -->
  <rect x="150" y="148" width="202" height="30" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="146" y="168" font-size="12" fill="#4b5563" text-anchor="end">실측</text>
  <text x="360" y="168" font-size="12" font-weight="700" fill="#92400e">810 : 45%</text>

  <!-- real ceiling 1220 -->
  <rect x="150" y="190" width="305" height="30" rx="4" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="146" y="210" font-size="12" fill="#4b5563" text-anchor="end">실제 상한</text>
  <text x="463" y="210" font-size="12" font-weight="700" fill="#065f46">1220 : 파드 x 풀</text>

  <!-- threshold line 1800 -->
  <line x1="600" y1="58" x2="600" y2="286" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="596" y="250" font-size="12" font-weight="700" fill="#991b1b" text-anchor="end">임계 1800</text>

  <text x="150" y="332" font-size="11.5" fill="#64748b">파드당 설정값만 더한 430은, 실제 인스턴스가 받는 압박을 3배 가까이 과소평가한다.</text>
</svg>
