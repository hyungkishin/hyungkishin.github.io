<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="ar-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e11d48" fill-opacity="0.75"/>
    </marker>
    <marker id="ar-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669" fill-opacity="0.8"/>
    </marker>
    <marker id="ar-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="20" fill="url(#bg3)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1e293b">조건을 두 번 조립하면 캐시와 서버가 갈라진다</text>
  <text x="40" y="78" font-size="14" fill="#64748b">key가 구분하는 요청과 queryFn이 실행하는 요청은 같아야 한다</text>

  <!-- URL: 두 장면이 공유하는 출발점 -->
  <g>
    <rect x="44" y="188" width="164" height="80" rx="14" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.45"/>
    <text x="126" y="216" font-size="14" font-weight="600" fill="#0e7490" text-anchor="middle">URL</text>
    <text x="126" y="242" font-size="12.5" fill="#334155" text-anchor="middle" font-family="monospace">category=shoes</text>
  </g>

  <!-- 장면 A: 각자 조립 -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.42;0.48;0.92;0.97;1" dur="8s" repeatCount="indefinite"/>

    <path d="M212 214 L272 160" stroke="#e11d48" stroke-opacity="0.45" stroke-width="1.6" fill="none" marker-end="url(#ar-rose)"/>
    <path d="M212 244 L272 296" stroke="#e11d48" stroke-opacity="0.45" stroke-width="1.6" fill="none" marker-end="url(#ar-rose)"/>

    <rect x="278" y="122" width="212" height="76" rx="14" fill="#e11d48" fill-opacity="0.06" stroke="#e11d48" stroke-opacity="0.4"/>
    <text x="384" y="150" font-size="13.5" font-weight="600" fill="#be123c" text-anchor="middle">key가 조건을 조립</text>
    <text x="384" y="176" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="monospace">category 포함</text>

    <rect x="278" y="258" width="212" height="76" rx="14" fill="#e11d48" fill-opacity="0.06" stroke="#e11d48" stroke-opacity="0.4"/>
    <text x="384" y="286" font-size="13.5" font-weight="600" fill="#be123c" text-anchor="middle">요청이 조건을 조립</text>
    <text x="384" y="312" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="monospace">category 누락</text>

    <path d="M494 160 L560 160" stroke="#e11d48" stroke-opacity="0.45" stroke-width="1.6" fill="none" marker-end="url(#ar-rose)"/>
    <path d="M494 296 L560 296" stroke="#e11d48" stroke-opacity="0.45" stroke-width="1.6" fill="none" marker-end="url(#ar-rose)"/>

    <rect x="566" y="122" width="290" height="76" rx="14" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.14"/>
    <text x="711" y="150" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">캐시는 두 조건으로 나눠 저장</text>
    <text x="711" y="176" font-size="12.5" fill="#64748b" text-anchor="middle">칸은 둘, 내용은 하나</text>

    <rect x="566" y="258" width="290" height="76" rx="14" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.14"/>
    <text x="711" y="286" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">서버는 같은 요청으로 처리</text>
    <text x="711" y="312" font-size="12.5" fill="#64748b" text-anchor="middle">에러 없이 잘못된 결과</text>

    <g>
      <animate attributeName="opacity" values="0.35;1;0.35" keyTimes="0;0.2;0.4" dur="8s" repeatCount="indefinite"/>
      <rect x="612" y="211" width="198" height="34" rx="10" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-opacity="0.55"/>
      <text x="711" y="233" font-size="13" font-weight="600" fill="#be123c" text-anchor="middle">두 요청의 의미가 어긋난다</text>
    </g>
  </g>

  <!-- 장면 B: 조건 객체 하나 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.52;0.90;0.95;1" dur="8s" repeatCount="indefinite"/>

    <path d="M212 228 L272 228" stroke="#0891b2" stroke-opacity="0.6" stroke-width="1.8" fill="none" marker-end="url(#ar-cyan)"/>

    <rect x="278" y="190" width="212" height="76" rx="14" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-opacity="0.45"/>
    <text x="384" y="218" font-size="13.5" font-weight="600" fill="#6d28d9" text-anchor="middle">조건 객체 하나</text>
    <text x="384" y="244" font-size="12.5" fill="#334155" text-anchor="middle" font-family="monospace">condition</text>

    <path d="M494 214 L560 160" stroke="#059669" stroke-opacity="0.5" stroke-width="1.8" fill="none" marker-end="url(#ar-emerald)"/>
    <path d="M494 244 L560 296" stroke="#059669" stroke-opacity="0.5" stroke-width="1.8" fill="none" marker-end="url(#ar-emerald)"/>

    <rect x="566" y="122" width="290" height="76" rx="14" fill="#059669" fill-opacity="0.06" stroke="#059669" stroke-opacity="0.4"/>
    <text x="711" y="150" font-size="13.5" font-weight="600" fill="#047857" text-anchor="middle">queryKey</text>
    <text x="711" y="176" font-size="12.5" fill="#64748b" text-anchor="middle">조건을 읽기만 한다</text>

    <rect x="566" y="258" width="290" height="76" rx="14" fill="#059669" fill-opacity="0.06" stroke="#059669" stroke-opacity="0.4"/>
    <text x="711" y="286" font-size="13.5" font-weight="600" fill="#047857" text-anchor="middle">queryFn</text>
    <text x="711" y="312" font-size="12.5" fill="#64748b" text-anchor="middle">같은 조건을 읽기만 한다</text>

    <g>
      <rect x="612" y="211" width="198" height="34" rx="10" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.5"/>
      <text x="711" y="233" font-size="13" font-weight="600" fill="#047857" text-anchor="middle">캐시 칸과 요청이 같아진다</text>
    </g>
  </g>

  <text x="40" y="392" font-size="13" fill="#64748b">조건을 조립하는 곳이 하나면 key와 요청이 어긋날 자리가 사라진다.</text>
</svg>
