<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <title>시뮬레이션 FCP 899ms가 만들어진 조건과 적용형 측정의 분기</title>
  <desc>서버 셸에 한글이 포함되자 첫 300ms 폰트 요청이 늘었다. 폰트 요청과 Lantern FCP는 세 조건에서 함께 변했지만 내부 계산은 확인하지 못했다. 실제 감속에서는 font-display swap으로 폰트 도착 전에 첫 페인트가 일어났다.</desc>
  <defs>
    <linearGradient id="causeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="20" fill="url(#causeBg)"/>
  <text x="44" y="50" font-size="21" font-weight="700" fill="#1e293b">같은 변경이 두 측정에서 다르게 보였다</text>
  <text x="44" y="77" font-size="13" fill="#64748b">위: Lantern이 재생한 경로 · 아래: 감속을 실제로 건 브라우저</text>

  <rect x="44" y="116" width="190" height="72" rx="12" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.4"/>
  <text x="139" y="145" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">서버 셸</text>
  <text x="139" y="167" font-size="13" fill="#334155" text-anchor="middle">한글 제목이 초기 HTML에 포함</text>

  <line x1="234" y1="152" x2="278" y2="152" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <rect x="280" y="116" width="250" height="72" rx="12" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-opacity="0.4"/>
  <text x="405" y="145" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">첫 300ms 폰트 요청</text>
  <text x="405" y="167" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle" font-family="monospace">64,312B → 183,324B</text>

  <line x1="530" y1="152" x2="574" y2="152" stroke="#d97706" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="576" y="116" width="280" height="72" rx="12" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-opacity="0.5"/>
  <text x="716" y="139" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Lantern 시뮬레이션</text>
  <text x="716" y="159" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle" font-family="monospace">FCP 차이 899ms</text>
  <text x="716" y="177" font-size="12" fill="#64748b" text-anchor="middle">내부 계산 미확정</text>

  <line x1="139" y1="188" x2="139" y2="284" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <text x="152" y="242" font-size="12.5" fill="#059669">같은 빌드</text>

  <rect x="44" y="286" width="250" height="80" rx="12" fill="#059669" fill-opacity="0.07" stroke="#059669" stroke-opacity="0.4"/>
  <text x="169" y="317" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">적용형 감속</text>
  <text x="169" y="341" font-size="13" fill="#334155" text-anchor="middle">브라우저 요청에 감속을 직접 적용</text>

  <line x1="294" y1="326" x2="348" y2="326" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="350" y="286" width="214" height="80" rx="12" fill="#059669" fill-opacity="0.07" stroke="#059669" stroke-opacity="0.4"/>
  <text x="457" y="317" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">font-display: swap</text>
  <text x="457" y="341" font-size="13" fill="#334155" text-anchor="middle">대체 글꼴로 먼저 페인트</text>

  <line x1="564" y1="326" x2="618" y2="326" stroke="#059669" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <rect x="620" y="286" width="236" height="80" rx="12" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-opacity="0.5"/>
  <text x="738" y="317" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">첫 페인트 1,705ms</text>
  <text x="738" y="341" font-size="13" fill="#334155" text-anchor="middle">폰트 도착 4,040ms보다 먼저</text>

  <rect x="44" y="410" width="812" height="108" rx="14" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.28"/>
  <text x="68" y="442" font-size="13" fill="#64748b">측정으로 분리된 것</text>
  <text x="68" y="470" font-size="15" font-weight="700" fill="#5b21b6">시뮬레이션 FCP: 899ms</text>
  <text x="68" y="496" font-size="15" font-weight="700" fill="#047857">적용형 FCP: 78ms</text>
  <text x="832" y="470" font-size="13.5" fill="#334155" text-anchor="end">899ms를 사용자 대기라고 볼 근거가 사라졌다</text>
  <text x="832" y="496" font-size="13.5" fill="#64748b" text-anchor="end">Lantern 내부 반영 기전은 아직 특정하지 않았다</text>
</svg>
