<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="retry-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="retry-error" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="retry-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="retry-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="retry-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="900" height="430" rx="20" fill="url(#retry-bg)"/>
  <text x="42" y="50" font-size="22" font-weight="700" fill="#1e293b">재시도는 원인을 바꾸지 않는다</text>
  <text x="42" y="77" font-size="14" fill="#64748b">page=1e20이 URL에 남아 있는 한 다음 요청도 같은 요청이다</text>

  <!-- 요청이 앞으로 이동하는 경로 -->
  <path id="retry-forward-1" d="M236,196 C265,196 279,196 308,196" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.28" marker-end="url(#retry-arrow-cyan)"/>
  <path id="retry-forward-2" d="M458,196 C487,196 501,196 530,196" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.28" marker-end="url(#retry-arrow-cyan)"/>
  <path id="retry-forward-3" d="M680,196 C709,196 723,196 752,196" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.32" marker-end="url(#retry-arrow-rose)"/>

  <!-- 재시도가 되돌아가는 지점은 에러가 아니라 원인이 남아 있는 URL이다 -->
  <path id="retry-loop" d="M806,266 C806,344 782,368 664,368 L286,368 C186,368 147,344 147,272" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="7 7" stroke-opacity="0.45" marker-end="url(#retry-arrow-rose)"/>
  <text x="475" y="390" font-size="12.5" text-anchor="middle" fill="#9f1239">재시도: 바뀐 것 없이 같은 URL을 다시 읽는다</text>

  <!-- 원인 상태. 이 그림에서 가장 강한 요소다 -->
  <g>
    <rect x="58" y="130" width="178" height="142" rx="16" fill="#e11d48" fill-opacity="0.06" stroke="#e11d48" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="80" y="160" font-size="13" font-weight="600" fill="#be123c">URL</text>
    <rect x="76" y="174" width="142" height="46" rx="10" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="147" y="203" font-size="15" font-weight="700" text-anchor="middle" fill="#be123c" font-family="monospace">page=1e20</text>
    <text x="147" y="246" font-size="13" font-weight="600" text-anchor="middle" fill="#9f1239">한 번도 바뀌지 않는다</text>
  </g>

  <g>
    <rect x="308" y="142" width="150" height="120" rx="16" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.38">
      <animate attributeName="stroke-opacity" values="0.38;0.38;1;0.38;0.38" keyTimes="0;0.18;0.23;0.30;1" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1;1;3;1;1" keyTimes="0;0.18;0.23;0.30;1" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="383" y="174" font-size="13" font-weight="600" text-anchor="middle" fill="#7c3aed">parser</text>
    <text x="383" y="207" font-size="14" text-anchor="middle" fill="#334155" font-family="monospace">isInteger</text>
    <text x="383" y="233" font-size="13" text-anchor="middle" fill="#7c3aed">true: 통과</text>
  </g>

  <g>
    <rect x="530" y="142" width="150" height="120" rx="16" fill="url(#retry-error)" stroke="#e11d48" stroke-opacity="0.38">
      <animate attributeName="stroke-opacity" values="0.38;0.38;1;0.38;0.38" keyTimes="0;0.38;0.43;0.50;1" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1;1;3;1;1" keyTimes="0;0.38;0.43;0.50;1" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="605" y="174" font-size="13" font-weight="600" text-anchor="middle" fill="#be123c">API</text>
    <text x="605" y="212" font-size="26" font-weight="700" text-anchor="middle" fill="#e11d48">400</text>
    <text x="605" y="236" font-size="12" text-anchor="middle" fill="#9f1239">safe integer 아님</text>
  </g>

  <g>
    <rect x="752" y="142" width="108" height="120" rx="16" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.14">
      <animate attributeName="stroke" values="#0f172a;#0f172a;#e11d48;#e11d48;#0f172a" keyTimes="0;0.55;0.60;0.82;1" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.14;0.14;0.8;0.8;0.14" keyTimes="0;0.55;0.60;0.82;1" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="806" y="175" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">에러 화면</text>
    <rect x="770" y="195" width="72" height="36" rx="9" fill="#e11d48" fill-opacity="0.1" stroke="#e11d48" stroke-opacity="0.55"/>
    <text x="806" y="218" font-size="13" font-weight="600" text-anchor="middle" fill="#be123c">재시도</text>
    <circle cx="806" cy="213" r="10" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0">
      <animate attributeName="r" values="10;10;32;10;10" keyTimes="0;0.66;0.72;0.79;1" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0;0.9;0;0" keyTimes="0;0.66;0.68;0.79;1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="6" fill="#0891b2" filter="url(#retry-glow)" opacity="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.05;0.18;1" calcMode="linear">
      <mpath href="#retry-forward-1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.16;0.18;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#7c3aed" filter="url(#retry-glow)" opacity="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.26;0.38;1" calcMode="linear">
      <mpath href="#retry-forward-2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.26;0.28;0.36;0.38;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#e11d48" filter="url(#retry-glow)" opacity="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.47;0.57;1" calcMode="linear">
      <mpath href="#retry-forward-3"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.49;0.55;0.57;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#e11d48" filter="url(#retry-glow)" opacity="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.72;0.92;1" calcMode="linear">
      <mpath href="#retry-loop"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.74;0.90;0.92;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
