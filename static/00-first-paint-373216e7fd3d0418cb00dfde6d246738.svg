<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <title>같은 FCP가 가리킨 서로 다른 첫 화면</title>
  <desc>Before는 Loading home만 보이고 After는 홈 제목과 설명과 Hero 영역이 보인다. 화면을 측정값에 맞춰 재구성한 모형이다.</desc>
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="900" height="470" rx="20" fill="url(#screenBg)"/>
  <text x="44" y="48" font-size="21" font-weight="700" fill="#1e293b">같은 FCP, 다른 첫 화면</text>
  <text x="44" y="74" font-size="13" fill="#64748b">측정 당시 화면을 수치와 DOM 상태로 재구성한 모형</text>

  <text x="70" y="116" font-size="13" font-weight="700" fill="#64748b">Before</text>
  <text x="410" y="116" font-size="13" font-weight="700" fill="#64748b" text-anchor="end" font-family="monospace">1,360ms</text>
  <rect x="70" y="132" width="340" height="238" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="240" y="255" font-size="15" fill="#94a3b8" text-anchor="middle" font-family="monospace">Loading home…</text>
  <text x="240" y="396" font-size="13" fill="#64748b" text-anchor="middle">로딩 문구만 그린 첫 페인트</text>

  <text x="490" y="116" font-size="13" font-weight="700" fill="#0891b2">After</text>
  <text x="830" y="116" font-size="13" font-weight="700" fill="#0891b2" text-anchor="end" font-family="monospace">2,259ms</text>
  <rect x="490" y="132" width="340" height="238" rx="12" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="514" y="172" font-size="15" font-weight="700" fill="#334155">매일 새롭게 발견하는 취향</text>
  <rect x="514" y="186" width="232" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>
  <rect x="514" y="200" width="176" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>
  <rect x="514" y="224" width="292" height="124" rx="10" fill="#0891b2" fill-opacity="0.09" stroke="#0891b2" stroke-opacity="0.35"/>
  <text x="660" y="290" font-size="13" font-weight="700" fill="#0891b2" text-anchor="middle">Hero</text>
  <text x="660" y="396" font-size="13" fill="#0891b2" text-anchor="middle">홈 구조가 들어온 첫 페인트</text>

  <rect x="326" y="420" width="248" height="32" rx="16" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-opacity="0.35"/>
  <text x="450" y="441" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">차이: 899ms</text>
</svg>
