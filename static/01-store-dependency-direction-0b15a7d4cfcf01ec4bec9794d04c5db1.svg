<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="dep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dep-problem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="dep-solution" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="dep-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="dep-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/>
    </marker>
    <marker id="dep-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/>
    </marker>
    <marker id="dep-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1000" height="560" rx="20" fill="url(#dep-bg)"/>
  <text x="44" y="48" font-size="23" font-weight="700" fill="#1e293b">통합 store 하나가 의존 방향을 뒤집었다</text>
  <text x="44" y="77" font-size="14" fill="#64748b">화살표는 import 방향이다: 소비자가 제공자를 가리킨다</text>

  <!-- 패널 -->
  <rect x="38" y="105" width="444" height="402" rx="18" fill="#ffffff" stroke="#e11d48" stroke-opacity="0.22"/>
  <rect x="518" y="105" width="444" height="402" rx="18" fill="#ffffff" stroke="#059669" stroke-opacity="0.22"/>

  <rect x="58" y="124" width="76" height="28" rx="14" fill="#e11d48" fill-opacity="0.1"/>
  <text x="96" y="143" font-size="12.5" font-weight="700" text-anchor="middle" fill="#be123c">B안</text>
  <text x="148" y="144" font-size="16" font-weight="700" fill="#334155">모델만 분리하고 store는 통합</text>

  <rect x="538" y="124" width="76" height="28" rx="14" fill="#059669" fill-opacity="0.1"/>
  <text x="576" y="143" font-size="12.5" font-weight="700" text-anchor="middle" fill="#047857">C안</text>
  <text x="628" y="144" font-size="16" font-weight="700" fill="#334155">모델과 store를 capability별로 분리</text>

  <!-- 레이어 경계 -->
  <rect x="58" y="171" width="404" height="108" rx="14" fill="#7c3aed" fill-opacity="0.035"/>
  <rect x="58" y="294" width="404" height="190" rx="14" fill="#0891b2" fill-opacity="0.035"/>
  <line x1="58" y1="286" x2="462" y2="286" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="74" y="192" font-size="12.5" font-weight="700" fill="#7c3aed">상위 레이어</text>
  <text x="74" y="316" font-size="12.5" font-weight="700" fill="#0891b2">entities 레이어</text>

  <rect x="538" y="171" width="404" height="108" rx="14" fill="#7c3aed" fill-opacity="0.025"/>
  <rect x="538" y="294" width="404" height="190" rx="14" fill="#059669" fill-opacity="0.035"/>
  <line x1="538" y1="286" x2="942" y2="286" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="554" y="192" font-size="12.5" font-weight="700" fill="#7c3aed">상위 레이어</text>
  <text x="554" y="316" font-size="12.5" font-weight="700" fill="#047857">entities 레이어</text>
  <text x="740" y="232" font-size="13" text-anchor="middle" fill="#94a3b8">공통 runtime 조립부 없음</text>

  <!-- 왼쪽 노드 4개 -->
  <g>
    <rect x="163" y="203" width="194" height="58" rx="12" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.42">
      <animate attributeName="stroke-opacity" values="0.42;0.42;0.95;0.42;0.42" keyTimes="0;0.08;0.16;0.28;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="260" y="227" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28d9">통합 store 조립부</text>
    <text x="260" y="247" font-size="12" text-anchor="middle" fill="#64748b">store 인스턴스 · selector</text>
  </g>

  <g>
    <rect x="76" y="342" width="116" height="58" rx="12" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.38"/>
    <text x="134" y="367" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0e7490">cart model</text>
    <text x="134" y="386" font-size="11.5" text-anchor="middle" fill="#64748b">capability</text>
  </g>
  <g>
    <rect x="202" y="342" width="116" height="58" rx="12" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.38"/>
    <text x="260" y="367" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0e7490">wish model</text>
    <text x="260" y="386" font-size="11.5" text-anchor="middle" fill="#64748b">capability</text>
  </g>
  <g>
    <rect x="328" y="342" width="116" height="58" rx="12" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.38">
      <animate attributeName="stroke" values="#0891b2;#0891b2;#e11d48;#e11d48;#0891b2" keyTimes="0;0.34;0.42;0.68;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.38;0.38;1;1;0.38" keyTimes="0;0.34;0.42;0.68;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1;1;2.5;2.5;1" keyTimes="0;0.34;0.42;0.68;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="386" y="367" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0e7490">cart UI</text>
    <text x="386" y="386" font-size="11.5" text-anchor="middle" fill="#64748b">selector 소비</text>
  </g>

  <!-- 왼쪽 import 경로. 소비자에서 제공자로 향한다 -->
  <path id="dep-left-cart" d="M215,261 C196,292 166,308 140,342" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.45" marker-end="url(#dep-arrow-cyan)"/>
  <path id="dep-left-wish" d="M260,261 L260,342" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.45" marker-end="url(#dep-arrow-cyan)"/>
  <path id="dep-left-reverse" d="M386,342 C386,300 347,276 328,261" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="7 6" stroke-opacity="0.72" marker-end="url(#dep-arrow-rose)"/>

  <rect x="266" y="410" width="178" height="47" rx="11" fill="url(#dep-problem)" stroke="#e11d48" stroke-opacity="0.38"/>
  <text x="355" y="430" font-size="12.5" font-weight="700" text-anchor="middle" fill="#be123c">역방향 의존</text>
  <text x="355" y="448" font-size="11.5" text-anchor="middle" fill="#9f1239">entities가 상위 레이어를 import</text>

  <!-- 오른쪽 노드 3개 -->
  <g>
    <rect x="562" y="342" width="160" height="70" rx="12" fill="url(#dep-solution)" stroke="#059669" stroke-opacity="0.5">
      <animate attributeName="stroke-opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.68;0.76;0.90;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1;1;2.5;1;1" keyTimes="0;0.68;0.76;0.90;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="642" y="365" font-size="13.5" font-weight="700" text-anchor="middle" fill="#047857">cart store · selector</text>
    <text x="642" y="385" font-size="11.5" text-anchor="middle" fill="#64748b">cart capability 안</text>
    <text x="642" y="402" font-size="11.5" text-anchor="middle" fill="#64748b">독립 runtime</text>
  </g>
  <g>
    <rect x="742" y="342" width="176" height="70" rx="12" fill="url(#dep-solution)" stroke="#059669" stroke-opacity="0.5"/>
    <text x="830" y="365" font-size="13.5" font-weight="700" text-anchor="middle" fill="#047857">wish store · selector</text>
    <text x="830" y="385" font-size="11.5" text-anchor="middle" fill="#64748b">wish capability 안</text>
    <text x="830" y="402" font-size="11.5" text-anchor="middle" fill="#64748b">독립 runtime</text>
  </g>
  <g>
    <rect x="562" y="430" width="160" height="38" rx="10" fill="#0891b2" fill-opacity="0.07" stroke="#0891b2" stroke-opacity="0.35"/>
    <text x="642" y="454" font-size="13" font-weight="700" text-anchor="middle" fill="#0e7490">cart UI</text>
  </g>

  <path id="dep-right-local" d="M642,430 L642,412" fill="none" stroke="#059669" stroke-width="2.5" stroke-opacity="0.75" marker-end="url(#dep-arrow-green)"/>
  <rect x="742" y="430" width="176" height="38" rx="10" fill="#059669" fill-opacity="0.08"/>
  <text x="830" y="447" font-size="12.5" font-weight="700" text-anchor="middle" fill="#047857">레이어 경계를 넘지 않는다</text>
  <text x="830" y="462" font-size="11.5" text-anchor="middle" fill="#64748b">capability별 변경 가능</text>

  <!-- 시간에 따라 import 경로를 따라가는 점 -->
  <circle r="6" fill="#0891b2" filter="url(#dep-glow)" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.08;0.22;1" calcMode="linear">
      <mpath href="#dep-left-cart"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.10;0.20;0.22;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#0891b2" filter="url(#dep-glow)" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.16;0.30;1" calcMode="linear">
      <mpath href="#dep-left-wish"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.16;0.18;0.28;0.30;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#e11d48" filter="url(#dep-glow)" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.38;0.56;1" calcMode="linear">
      <mpath href="#dep-left-reverse"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.40;0.54;0.56;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#059669" filter="url(#dep-glow)" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.72;0.84;1" calcMode="linear">
      <mpath href="#dep-right-local"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.74;0.82;0.84;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="500" y="535" font-size="13" text-anchor="middle" fill="#64748b">store를 capability 안에 두면 UI가 상위 조립부를 참조할 이유가 사라진다</text>
</svg>
