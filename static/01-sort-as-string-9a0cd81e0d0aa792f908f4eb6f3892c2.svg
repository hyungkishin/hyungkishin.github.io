<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="sortbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sortglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="20" fill="url(#sortbg)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#1e293b">기본 비교자는 숫자를 보지 않는다</text>
  <text x="40" y="78" font-size="14" fill="#64748b">비교 전에 모든 원소가 문자열이 된다. 비교되는 것은 첫 코드 유닛부터다.</text>

  <!-- 단계 라벨 -->
  <text x="40" y="132" font-size="12" fill="#94a3b8" font-family="monospace">1. 입력</text>
  <text x="40" y="232" font-size="12" fill="#94a3b8" font-family="monospace">2. ToString</text>
  <text x="40" y="352" font-size="12" fill="#94a3b8" font-family="monospace">3. 결과</text>

  <!-- 1. 입력 배열 -->
  <g>
    <rect x="150" y="108" width="110" height="46" rx="12" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/>
    <text x="205" y="137" font-size="17" fill="#0e7490" text-anchor="middle" font-family="monospace">10</text>
    <rect x="280" y="108" width="110" height="46" rx="12" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/>
    <text x="335" y="137" font-size="17" fill="#0e7490" text-anchor="middle" font-family="monospace">9</text>
    <rect x="410" y="108" width="110" height="46" rx="12" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/>
    <text x="465" y="137" font-size="17" fill="#0e7490" text-anchor="middle" font-family="monospace">100</text>
    <rect x="540" y="108" width="110" height="46" rx="12" fill="#0891b2" fill-opacity="0.10" stroke="#0891b2" stroke-opacity="0.45"/>
    <text x="595" y="137" font-size="17" fill="#0e7490" text-anchor="middle" font-family="monospace">1</text>
  </g>

  <!-- 변환 화살표 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;1;0" keyTimes="0;0.18;0.26;0.80;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    <line x1="400" y1="162" x2="400" y2="196" stroke="#a855f7" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M 400 202 l -6 -10 l 12 0 z" fill="#a855f7" fill-opacity="0.7"/>
    <text x="418" y="188" font-size="13" fill="#7e22ce" font-family="monospace">String(x)</text>
  </g>

  <!-- 2. 문자열 배열 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;1;0" keyTimes="0;0.22;0.30;0.80;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="150" y="212" width="110" height="46" rx="12" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="205" y="241" font-size="17" fill="#7e22ce" text-anchor="middle" font-family="monospace">"10"</text>
    <rect x="280" y="212" width="110" height="46" rx="12" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="335" y="241" font-size="17" fill="#7e22ce" text-anchor="middle" font-family="monospace">"9"</text>
    <rect x="410" y="212" width="110" height="46" rx="12" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="465" y="241" font-size="17" fill="#7e22ce" text-anchor="middle" font-family="monospace">"100"</text>
    <rect x="540" y="212" width="110" height="46" rx="12" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.45"/>
    <text x="595" y="241" font-size="17" fill="#7e22ce" text-anchor="middle" font-family="monospace">"1"</text>
  </g>

  <!-- 비교 하이라이트: "9" vs "100" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.42;0.62;0.68;1" dur="9s" repeatCount="indefinite"/>
    <rect x="276" y="208" width="118" height="54" rx="14" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#sortglow)"/>
    <rect x="406" y="208" width="118" height="54" rx="14" fill="none" stroke="#f59e0b" stroke-width="2.5" filter="url(#sortglow)"/>
    <text x="400" y="292" font-size="14" fill="#b45309" text-anchor="middle" font-family="monospace">'9' (57) &gt; '1' (49)</text>
    <text x="400" y="313" font-size="13" fill="#92400e" text-anchor="middle">첫 글자에서 승부가 끝난다. 나머지 자릿수는 읽지 않는다.</text>
  </g>

  <!-- 3. 결과 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.76;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="150" y="330" width="110" height="46" rx="12" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.55"/>
    <text x="205" y="359" font-size="17" fill="#047857" text-anchor="middle" font-family="monospace">1</text>
    <rect x="280" y="330" width="110" height="46" rx="12" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.55"/>
    <text x="335" y="359" font-size="17" fill="#047857" text-anchor="middle" font-family="monospace">10</text>
    <rect x="410" y="330" width="110" height="46" rx="12" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.55"/>
    <text x="465" y="359" font-size="17" fill="#047857" text-anchor="middle" font-family="monospace">100</text>
    <rect x="540" y="330" width="110" height="46" rx="12" fill="#fb7185" fill-opacity="0.14" stroke="#fb7185" stroke-opacity="0.7"/>
    <text x="595" y="359" font-size="17" fill="#be123c" text-anchor="middle" font-family="monospace">9</text>
    <text x="680" y="359" font-size="13" fill="#be123c">9가 맨 뒤로 간다</text>
  </g>
</svg>
