<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131629"/>
      <stop offset="1" stop-color="#1d2340"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="400" rx="20" fill="url(#bg2)"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#e6e9f5">parser는 관문이다</text>
  <text x="40" y="78" font-size="14" fill="#8b93b8">잘못된 값은 화면에 닿기 전에 기본값이 된다</text>

  <!-- 레인 -->
  <line x1="40" y1="150" x2="660" y2="150" stroke="#ffffff" stroke-opacity="0.06"/>
  <line x1="40" y1="215" x2="660" y2="215" stroke="#ffffff" stroke-opacity="0.06"/>
  <line x1="40" y1="280" x2="660" y2="280" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- 관문 -->
  <rect x="440" y="105" width="80" height="215" rx="14" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;1;0.55;0.55" keyTimes="0;0.30;0.34;0.38;0.42;0.46;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1.5;1.5;3;1.5;3;1.5;1.5" keyTimes="0;0.30;0.34;0.38;0.42;0.46;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="480" y="96" font-size="13" fill="#7de6f7" text-anchor="middle" font-family="monospace">parseAsPageNumber</text>

  <!-- 통과 칩: page=3 -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;240,0;240,0;470,0;470,0" keyTimes="0;0.05;0.30;0.36;0.50;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;0;0;1" keyTimes="0;0.05;0.44;0.48;0.52;0.96;1" dur="6s" repeatCount="indefinite"/>
    <rect x="60" y="131" width="140" height="38" rx="10" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.8"/>
    <text x="130" y="155" font-size="13" fill="#6ee7b7" text-anchor="middle" font-family="monospace">?page=3</text>
  </g>

  <!-- 거절 칩: page=1e20 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;240,0;240,0" keyTimes="0;0.05;0.30;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;0.30;0.42;0.46;0.96;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-6,0;6,0;-4,0;0,0;0,0" keyTimes="0;0.32;0.34;0.36;0.38;0.40;1" dur="6s" repeatCount="indefinite"/>
      <rect x="60" y="196" width="140" height="38" rx="10" fill="#fb7185" fill-opacity="0.10" stroke="#fb7185" stroke-opacity="0.8"/>
      <text x="130" y="220" font-size="13" fill="#fda4af" text-anchor="middle" font-family="monospace">?page=1e20</text>
    </g>
  </g>

  <!-- 거절 칩: page=abc -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;240,0;240,0" keyTimes="0;0.08;0.33;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;0.33;0.45;0.49;0.96;1" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-6,0;6,0;-4,0;0,0;0,0" keyTimes="0;0.35;0.37;0.39;0.41;0.43;1" dur="6s" repeatCount="indefinite"/>
      <rect x="60" y="261" width="140" height="38" rx="10" fill="#fb7185" fill-opacity="0.10" stroke="#fb7185" stroke-opacity="0.8"/>
      <text x="130" y="285" font-size="13" fill="#fda4af" text-anchor="middle" font-family="monospace">?page=abc</text>
    </g>
  </g>

  <!-- 기본값 칩: 레인 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.50;0.58;0.62;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;110,0;110,0" keyTimes="0;0.48;0.60;1" dur="6s" repeatCount="indefinite"/>
    <rect x="534" y="199" width="46" height="32" rx="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.9" filter="url(#glow2)"/>
    <text x="557" y="220" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="monospace">1</text>
  </g>

  <!-- 기본값 칩: 레인 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.53;0.61;0.65;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;110,0;110,0" keyTimes="0;0.51;0.63;1" dur="6s" repeatCount="indefinite"/>
    <rect x="534" y="264" width="46" height="32" rx="8" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.9" filter="url(#glow2)"/>
    <text x="557" y="285" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="monospace">1</text>
  </g>

  <!-- 쿼리 조건 박스 -->
  <g>
    <rect x="690" y="110" width="180" height="210" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="780" y="142" font-size="15" font-weight="600" fill="#cdd3ea" text-anchor="middle">쿼리 조건</text>
    <text x="710" y="182" font-size="14" fill="#6ee7b7" font-family="monospace" opacity="0">
      page: 3
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.54;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="710" y="222" font-size="14" fill="#fbbf24" font-family="monospace" opacity="0">
      page: 1
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.64;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="710" y="262" font-size="14" fill="#fbbf24" font-family="monospace" opacity="0">
      page: 1
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.67;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="770" y="222" font-size="11" fill="#8b93b8" opacity="0">
      기본값
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.64;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="770" y="262" font-size="11" fill="#8b93b8" opacity="0">
      기본값
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.67;0.92;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="40" y="368" font-size="13" fill="#8b93b8">통과하지 못한 값은 API로 가지 않는다. 기본값 1로 되돌아갈 뿐이다.</text>
</svg>
