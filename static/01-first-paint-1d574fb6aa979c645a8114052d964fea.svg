<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bgPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="gapL" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#d97706"/>
    </marker>
    <marker id="gapR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" rx="20" fill="url(#bgPaint)"/>

  <text x="44" y="52" font-size="21" font-weight="700" fill="#1e293b">같은 FCP가 서로 다른 첫 화면을 가리켰다</text>
  <text x="44" y="78" font-size="13.5" fill="#64748b">되돌리면 왼쪽으로 간다. 시뮬레이션 899ms를 아끼고 홈 대신 로딩 문구를 먼저 본다.</text>

  <!-- Before -->
  <text x="80" y="132" font-size="13" font-weight="600" fill="#64748b">Before</text>
  <text x="390" y="132" font-size="13" font-weight="700" fill="#64748b" text-anchor="end" font-family="monospace">시뮬레이션 FCP 1,360ms</text>
  <rect x="80" y="146" width="310" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="235" y="266" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="monospace">Loading home…</text>
  <text x="235" y="396" font-size="12.5" fill="#94a3b8" text-anchor="middle">글자 한 줄. 홈인지 알 수 없다</text>

  <!-- 899ms -->
  <text x="450" y="254" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">899ms</text>
  <line x1="404" y1="268" x2="466" y2="268" stroke="#d97706" stroke-width="1.5" marker-start="url(#gapL)" marker-end="url(#gapR)"/>

  <!-- After -->
  <text x="510" y="132" font-size="13" font-weight="600" fill="#0e7490">After</text>
  <text x="820" y="132" font-size="13" font-weight="700" fill="#0e7490" text-anchor="end" font-family="monospace">시뮬레이션 FCP 2,259ms</text>
  <rect x="510" y="146" width="310" height="230" rx="12" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.45" stroke-width="1.5"/>

  <text x="534" y="186" font-size="14.5" font-weight="700" fill="#334155">매일 새롭게 발견하는 취향</text>
  <rect x="534" y="198" width="220" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>
  <rect x="534" y="212" width="164" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>

  <rect x="534" y="234" width="262" height="120" rx="10" fill="#0891b2" fill-opacity="0.09" stroke="#0891b2" stroke-opacity="0.35"/>
  <text x="665" y="299" font-size="13" font-weight="600" fill="#0e7490" text-anchor="middle">Hero</text>

  <text x="665" y="396" font-size="12.5" fill="#0e7490" text-anchor="middle">제목과 설명과 Hero가 자리를 잡은 홈</text>

  <line x1="80" y1="424" x2="820" y2="424" stroke="#cbd5e1"/>
  <text x="80" y="450" font-size="12.5" fill="#64748b">두 숫자 모두 FCP다. 왼쪽은 로딩이 시작된 시간이고 오른쪽은 홈이 시작된 시간이다.</text>
</svg>
