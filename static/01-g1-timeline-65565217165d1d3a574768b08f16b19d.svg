<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 484" role="img" aria-labelledby="title desc">
  <title id="title">첫 마킹 주기 안팎의 일곱 번의 정지</title>
  <desc id="desc">96 MiB 힙에서 첫 마킹 주기는 JVM 기동 후 27.402밀리초부터 30.301밀리초까지였다. 같은 시간대의 정지 시작 시각과 지속 시간을 그림 아래에서 읽을 수 있다. 세로선은 실제 순서를 느리게 재생한다.</desc>
  <style>
    text { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #19324e }
    .heading { font-size: 23px; font-weight: 760; }
    .small { font-size: 16px; }
    .track { font-size: 16px; font-weight: 700; }
    .axis text { font-size: 15px; text-anchor: middle; }
    .axis path { fill: none; stroke: #849bb5; }
    .time,.duration { font-family: ui-monospace, monospace; font-size: 16px; }
    .duration { text-anchor: end; }
    .event { font-size: 16.5px; font-weight: 620; }
    .cursor { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { opacity: 1; animation: cross 8s linear infinite; }
    }
    @keyframes cross { from { transform: translateX(0); } to { transform: translateX(356px); } }
  </style>
  <rect x="1" y="1" width="430" height="482" rx="13" fill="#fff" stroke="#c9d9eb"/>
  <text x="22" y="38" class="heading">G1이 멈춘 시간</text>
  <text x="22" y="65" class="small">96 MiB 첫 실행 · JVM 기동 후 경과 시간(ms)</text>
  <rect x="13" y="80" width="405" height="135" rx="8" fill="#f4f8ff"/>
  <text x="23" y="105" class="track">마킹 주기 · 27.402~30.301 ms</text>
  <rect x="91.39" y="119" width="158.78" height="12" fill="#bed6ff"/>
  <text x="23" y="150" class="track">애플리케이션 정지</text>
  <rect x="65.23" y="156" width="25.07" height="12" fill="#214bac"/>
<rect x="150.79" y="156" width="22.97" height="12" fill="#214bac"/>
<rect x="179.14" y="156" width="5.04" height="12" fill="#214bac"/>
<rect x="207.01" y="156" width="22.81" height="12" fill="#214bac"/>
<rect x="242.85" y="156" width="0.59" height="12" fill="#214bac"/>
<rect x="288.07" y="156" width="27.6" height="12" fill="#214bac"/>
<rect x="355.54" y="156" width="28.21" height="12" fill="#214bac"/>
  <g class="axis"><path d="M42 181h356"/><path d="M69.38 181v5"/><text x="69.38" y="204">27</text>
<path d="M178.92 181v5"/><text x="178.92" y="204">29</text>
<path d="M288.46 181v5"/><text x="288.46" y="204">31</text>
<path d="M398.0 181v5"/><text x="398.0" y="204">33</text></g>
  <path class="cursor" d="M42 111v23 M42 154v21" fill="none" stroke="#071f5d" stroke-width="1.5" stroke-dasharray="3 2"/>
  <g class="track"><text x="23" y="239">시작(ms)</text><text x="106" y="239">로그의 단계</text><text x="407" y="239" text-anchor="end">정지(ms)</text></g>
  <path d="M22 248h385" stroke="#b3c7df"/>
  <g transform="translate(0 272)"><text x="23" class="time">26.924</text><text x="106" class="event">Young · Concurrent Start</text><text x="407" class="duration">0.457</text></g>
<g transform="translate(0 301)"><text x="23" class="time">28.486</text><text x="106" class="event">Young · Normal</text><text x="407" class="duration">0.419</text></g>
<g transform="translate(0 330)"><text x="23" class="time">29.004</text><text x="106" class="event">Remark</text><text x="407" class="duration">0.091</text></g>
<g transform="translate(0 359)"><text x="23" class="time">29.513</text><text x="106" class="event">Young · Normal</text><text x="407" class="duration">0.416</text></g>
<g transform="translate(0 388)"><text x="23" class="time">30.167</text><text x="106" class="event">Cleanup</text><text x="407" class="duration">0.010</text></g>
<g transform="translate(0 417)"><text x="23" class="time">30.993</text><text x="106" class="event">Young · Prepare Mixed</text><text x="407" class="duration">0.504</text></g>
<g transform="translate(0 446)"><text x="23" class="time">32.225</text><text x="106" class="event">Young · Mixed</text><text x="407" class="duration">0.515</text></g>
</svg>
