<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <title>총 폰트 전송량은 같지만 navigation 이후 300ms 안의 요청량은 다른 세 조건</title>
  <desc>Before와 라틴 치환은 300ms 안에 폰트 2건 64,312바이트를 요청하고 After 한글은 7건 183,324바이트를 요청한다. 세 조건의 최종 합계는 모두 10건 265,088바이트다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" rx="20" fill="url(#background)"/>

  <text x="44" y="52" font-size="21" font-weight="700" fill="#1e293b">총합이 같아도 300ms 안쪽은 달랐다</text>
  <text x="44" y="79" font-size="13.5" fill="#64748b">navigation 이후 요청 시작 시각으로 나눈 세 조건</text>

  <rect x="216" y="112" width="286" height="296" rx="14" fill="#d97706" fill-opacity="0.07" stroke="#d97706" stroke-opacity="0.25">
    <animate attributeName="fill-opacity" values="0.07;0.07;0.14;0.14;0.07" keyTimes="0;0.35;0.48;0.85;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.25;0.25;0.65;0.65;0.25" keyTimes="0;0.35;0.48;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="228" y="136" font-size="13" font-weight="700" fill="#d97706">첫 300ms</text>
  <text x="502" y="136" font-size="12.5" fill="#64748b" text-anchor="end">이 구간만 비교</text>

  <line x1="216" y1="156" x2="788" y2="156" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="216" y1="151" x2="216" y2="161" stroke="#94a3b8"/>
  <line x1="502" y1="151" x2="502" y2="161" stroke="#d97706" stroke-width="1.5"/>
  <line x1="788" y1="151" x2="788" y2="161" stroke="#94a3b8"/>
  <text x="216" y="178" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="monospace">0ms</text>
  <text x="502" y="178" font-size="12.5" font-weight="700" fill="#d97706" text-anchor="middle" font-family="monospace">300ms</text>
  <text x="788" y="178" font-size="12.5" fill="#64748b" text-anchor="middle">이후</text>

  <g>
    <text x="44" y="232" font-size="14" font-weight="700" fill="#334155">Before</text>
    <rect x="216" y="207" width="286" height="38" rx="9" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-opacity="0.35"/>
    <rect x="228" y="216" width="91" height="20" rx="6" fill="#d97706" fill-opacity="0.22"/>
    <text x="330" y="231" font-size="13" font-weight="700" fill="#92400e" font-family="monospace">2건 64,312B</text>
    <rect x="516" y="207" width="272" height="38" rx="9" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.22"/>
    <text x="652" y="231" font-size="13" fill="#64748b" text-anchor="middle">나머지 8건</text>
  </g>

  <g>
    <text x="44" y="303" font-size="14" font-weight="700" fill="#0891b2">After 한글</text>
    <rect x="216" y="278" width="286" height="38" rx="9" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-opacity="0.5"/>
    <rect x="228" y="287" width="198" height="20" rx="6" fill="#d97706" fill-opacity="0.34"/>
    <text x="438" y="302" font-size="13" font-weight="700" fill="#92400e" font-family="monospace">7건 183,324B</text>
    <rect x="516" y="278" width="272" height="38" rx="9" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.22"/>
    <text x="652" y="302" font-size="13" fill="#64748b" text-anchor="middle">나머지 3건</text>
  </g>

  <g>
    <text x="44" y="374" font-size="14" font-weight="700" fill="#334155">라틴 치환</text>
    <rect x="216" y="349" width="286" height="38" rx="9" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-opacity="0.35"/>
    <rect x="228" y="358" width="91" height="20" rx="6" fill="#d97706" fill-opacity="0.22"/>
    <text x="330" y="373" font-size="13" font-weight="700" fill="#92400e" font-family="monospace">2건 64,312B</text>
    <rect x="516" y="349" width="272" height="38" rx="9" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.22"/>
    <text x="652" y="373" font-size="13" fill="#64748b" text-anchor="middle">나머지 8건</text>
  </g>

  <line x1="216" y1="194" x2="216" y2="398" stroke="#d97706" stroke-width="2" opacity="0" filter="url(#glow)">
    <animate attributeName="x1" values="216;216;502;502;216" keyTimes="0;0.12;0.42;0.88;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="216;216;502;502;216" keyTimes="0;0.12;0.42;0.88;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0;0" keyTimes="0;0.12;0.42;0.88;1" dur="7s" repeatCount="indefinite"/>
  </line>

  <rect x="44" y="432" width="812" height="56" rx="12" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-opacity="0.25"/>
  <text x="64" y="457" font-size="13" fill="#64748b">세 조건의 최종 합계</text>
  <text x="64" y="477" font-size="15" font-weight="700" fill="#5b21b6" font-family="monospace">10건 265,088B</text>
  <text x="836" y="468" font-size="14" font-weight="700" fill="#d97706" text-anchor="end" opacity="0.55">총합은 300ms 안의 배분을 반증하지 못한다
    <animate attributeName="opacity" values="0.55;0.55;1;1;0.55" keyTimes="0;0.42;0.52;0.88;1" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
