<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 접수 응답과 송금 확정까지의 경과시간</title>
  <desc id="desc">서버가 요청을 받은 시점에서 두 타이머를 시작하는 예다. HTTP 타이머는 요청을 저장하고 접수 응답을 반환한 시점에 끝난다. 업무 완료 타이머는 이후 심사와 외부 송금이 끝나 확정된 시점에 끝난다. 둘 다 대기를 포함한 경과시간이며 CPU 시간이 아니다. 시간축의 길이와 애니메이션 속도는 실측값이 아니다. 움직임 감소 설정에서도 두 구간과 종료 지점은 정적으로 보인다.</desc>
  <style>
    text { font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; fill: #172338; }
    .heading { font-size: 32px; font-weight: 750; }
    .label { font-size: 25px; font-weight: 700; }
    .body { font-size: 23px; }
    .small { font-size: 21px; }
    .muted { fill: #536477; }
    .http-dot { animation: http-clock 12s linear infinite; }
    .business-dot { animation: business-clock 12s linear infinite; }
    @keyframes http-clock { 0%, 5% { opacity: 1; transform: translateX(0); } 30%, 94% { opacity: 1; transform: translateX(210px); } 96%, 100% { opacity: 0; transform: translateX(210px); } }
    @keyframes business-clock { 0%, 5% { opacity: 1; transform: translateX(0); } 88%, 94% { opacity: 1; transform: translateX(630px); } 96%, 100% { opacity: 0; transform: translateX(630px); } }
    @media (prefers-reduced-motion: reduce) { .http-dot, .business-dot { animation: none; display: none; } }
  </style>
  <rect width="960" height="650" rx="18" fill="#fff"/>
  <text x="42" y="57" class="heading">접수 응답 뒤에도 업무 시간은 흐른다</text>
  <text x="42" y="96" class="body muted">같은 요청의 종료점을 다르게 잡으면 서로 다른 지연을 측정한다.</text>

  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 6">
    <path d="M 260 176 V 479"/><path d="M 470 176 V 479"/><path d="M 890 176 V 479"/>
  </g>
  <text x="260" y="156" text-anchor="middle" class="label">요청 접수</text>
  <text x="470" y="156" text-anchor="middle" class="label">접수 응답</text>
  <text x="885" y="156" text-anchor="end" class="label">송금 확정</text>

  <text x="42" y="250" class="label">HTTP 타이머</text>
  <text x="42" y="284" class="small muted">접수 응답까지</text>
  <rect x="260" y="225" width="210" height="38" rx="19" fill="#dceafe"/>
  <path d="M 260 244 H 470" stroke="#558ed2" stroke-width="4"/>
  <circle cx="260" cy="244" r="6" fill="#558ed2"/>
  <circle cx="470" cy="244" r="8" fill="#fff" stroke="#558ed2" stroke-width="3"/>
  <circle cx="260" cy="244" r="10" fill="#245f9f" class="http-dot"/>
  <text x="510" y="251" class="body" fill="#245f9f">측정 종료</text>

  <text x="42" y="384" class="label">업무 타이머</text>
  <text x="42" y="418" class="small muted">송금 확정까지</text>
  <rect x="260" y="359" width="630" height="38" rx="19" fill="#def3e9"/>
  <path d="M 260 378 H 890" stroke="#469c76" stroke-width="4"/>
  <circle cx="260" cy="378" r="6" fill="#469c76"/>
  <circle cx="890" cy="378" r="8" fill="#fff" stroke="#469c76" stroke-width="3"/>
  <circle cx="260" cy="378" r="10" fill="#23764f" class="business-dot"/>

  <path d="M 260 478 H 890" stroke="#a8b6c5" stroke-width="2"/>
  <path d="M 260 469 V 487 M 470 469 V 487 M 890 469 V 487" stroke="#a8b6c5" stroke-width="2"/>
  <text x="365" y="520" text-anchor="middle" class="body muted">요청 저장</text>
  <text x="680" y="520" text-anchor="middle" class="body muted">심사 대기·실행과 외부 송금</text>
  <text x="42" y="581" class="body">두 값은 모두 경과시간이다. CPU 실행 시간과는 구분한다.</text>
  <text x="42" y="619" class="small muted">서버에서 관측한 요청 접수가 시작점이다. 길이와 이동 속도는 설명용이다.</text>
</svg>
