<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bgOwn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="440" rx="20" fill="url(#bgOwn)"/>

  <text x="40" y="50" font-size="19" font-weight="700" fill="#1e293b">값을 읽는 곳은 여러 곳이어도,</text>
  <text x="40" y="76" font-size="19" font-weight="700" fill="#1e293b">그 값을 바꾸고 진실을 확정하는 곳은 따로 있다.</text>

  <!-- 열 머리 -->
  <text x="380" y="130" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="end">진실을 확정하는 곳</text>
  <text x="422" y="130" font-size="13.5" font-weight="700" fill="#64748b">보관하거나 파생해서 읽는 곳</text>

  <!-- 좌우를 가르는 경계. 데이터 흐름이 아니라 소유의 경계선이다 -->
  <line x1="401" y1="112" x2="401" y2="352" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="2"/>

  <!-- 1 -->
  <text x="380" y="176" font-size="16.5" font-weight="600" fill="#6d28d9" text-anchor="end">서버 데이터</text>
  <text x="422" y="176" font-size="15" fill="#475569">Query Cache · 화면</text>

  <!-- 2 -->
  <text x="380" y="230" font-size="16.5" font-weight="600" fill="#6d28d9" text-anchor="end">URL 검색 조건</text>
  <text x="422" y="230" font-size="15" fill="#475569">query key · API 요청 · 필터 UI</text>

  <!-- 3 -->
  <text x="380" y="284" font-size="16.5" font-weight="600" fill="#6d28d9" text-anchor="end">Store의 ID 목록</text>
  <text x="422" y="284" font-size="15" fill="#475569">장바구니 개수 · 상품 포함 여부</text>

  <!-- 4 -->
  <text x="380" y="338" font-size="16.5" font-weight="600" fill="#6d28d9" text-anchor="end">입력 중인 값</text>
  <text x="422" y="338" font-size="15" fill="#475569">글자 수 · 검증 결과 · 버튼 상태</text>

  <text x="40" y="398" font-size="13.5" fill="#64748b">오른쪽은 값을 보관하거나 표현하지만 진실을 확정하지 않는다.</text>
  <text x="40" y="420" font-size="13.5" fill="#64748b">다시 계산할 수 있는 값은 별도의 원본으로 저장하지 않는다.</text>
</svg>
