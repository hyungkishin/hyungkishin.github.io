<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 419" role="img" aria-labelledby="title desc">
  <title id="title">saved를 비우기 전후의 영수증 참조</title>
  <desc id="desc">saveForLater가 반환해도 GC 루트에서 해당 클래스의 정적 필드 saved를 통해 영수증에 닿는다. 약한 참조도 같은 영수증을 가리킨다. saved를 null로 바꾼 직후에는 이 강한 경로가 끊긴다. 다른 강한 경로가 없고 약한 참조만 남은 영수증은 GC 대상이다. 약한 참조가 지워지고 공간이 회수되는 시점은 이 그림에서 측정하지 않는다. 두 장면은 같은 객체를 보여 준다.</desc>
  <style>
    text { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #101d35; }
    .title { font-size: 24px; font-weight: 750; letter-spacing: -.7px; }
    .note { font-size: 17px; fill: #405574; }
    .phase { font-weight: 700; font-size: 18px; fill: #244db7; }
    .code { font: 600 18px "SFMono-Regular", Consolas, monospace; }
    .weak { stroke: #7184a5; stroke-width: 1.8; fill: none; stroke-dasharray: 3 4; }
    .highlight { fill: none; opacity: 0; stroke: #2455df; stroke-width: 2.6; }
    @media (prefers-reduced-motion: no-preference) {
      .held { animation: follow-strong 8s linear infinite; }
      .released { animation: lose-strong 8s linear infinite; }
    }
    @keyframes follow-strong { 0%, 39%, 100% { opacity: 1; } 49%, 90% { opacity: 0; } }
    @keyframes lose-strong { 0%, 39%, 100% { opacity: 0; } 49%, 90% { opacity: 1; } }
  </style>
  <defs>
    <marker id="strong-tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8z" fill="#2455c1"/></marker>
    <marker id="weak-tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 8 4 0 8z" fill="#7184a5"/></marker>
  </defs>
  <rect width="460" height="419" rx="12" fill="#fff"/>
  <text x="18" y="34" class="title">같은 영수증에 남은 두 종류의 참조</text>
  <text x="18" y="63" class="note">saved는 GC 루트에서 닿는 클래스의 정적 필드다.</text>

  <rect x="16" y="82" width="428" height="115" rx="8" fill="#f5f8ff" stroke="#c5d4ef"/>
  <rect x="16" y="82" width="428" height="115" rx="8" class="highlight held"/>
  <text x="28" y="110" class="phase">saveForLater 반환 뒤</text>
  <text x="28" y="144" class="code">saved</text>
  <path d="M107 137H303" stroke="#2455c1" stroke-width="2" marker-end="url(#strong-tip)"/>
  <text x="28" y="178" class="code">WeakReference</text>
  <path d="M184 172H264L281 155H303" class="weak" marker-end="url(#weak-tip)"/>
  <rect x="308" y="121" width="121" height="56" rx="7" fill="#e6efff" stroke="#9bb5e8"/>
  <text x="321" y="144" class="code">Receipt</text>
  <text x="321" y="165" class="note">100원</text>

  <rect x="16" y="212" width="428" height="115" rx="8" fill="#f8faff" stroke="#c5d4ef"/>
  <rect x="16" y="212" width="428" height="115" rx="8" class="highlight released"/>
  <text x="28" y="240" class="phase">saved를 비운 직후</text>
  <text x="28" y="275" class="code">saved = null</text>
  <text x="181" y="275" class="note">강한 경로 끊김</text>
  <text x="28" y="308" class="code">WeakReference</text>
  <path d="M184 302H264L281 285H303" class="weak" marker-end="url(#weak-tip)"/>
  <rect x="308" y="251" width="121" height="56" rx="7" fill="#e6efff" stroke="#9bb5e8"/>
  <text x="321" y="274" class="code">Receipt</text>
  <text x="321" y="295" class="note">100원</text>

  <path d="M17 351H443" stroke="#c7d5e8"/>
  <text x="18" y="378" class="note">다른 강한 경로가 없으면 영수증은 GC 대상이다.</text>
  <text x="18" y="403" class="note">실제 회수 시점은 JVM이 정한다.</text>
</svg>
