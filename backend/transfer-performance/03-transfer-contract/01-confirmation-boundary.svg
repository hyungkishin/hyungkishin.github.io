<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
  <title id="title">송금 확정 전 심사와 HTTP 응답 시점</title>
  <desc id="desc">동기 승인은 심사와 송금 확정이 끝난 뒤 응답한다. 비동기 승인은 접수 응답 후 심사와 송금 확정을 진행한다. 두 경우 모두 심사가 확정보다 앞선다. 사후 탐지는 송금 확정 뒤 심사하므로 이미 확정한 송금의 사전 차단에 사용할 수 없다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <style>
    text { font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif; fill: #172338; }
    .heading { font-size: 32px; font-weight: 750; }
    .label { font-size: 25px; font-weight: 700; }
    .body { font-size: 22px; }
    .muted { fill: #536477; }
    .node { stroke-width: 2; }
  </style>
  <rect width="960" height="740" rx="18" fill="#fff"/>
  <text x="42" y="57" class="heading">확정 전 심사와 응답 시점</text>
  <text x="42" y="95" class="body muted">비동기 승인을 선택해도 심사는 송금 확정보다 앞선다.</text>

  <path d="M 42 131 H 918 M 42 315 H 918 M 42 499 H 918" stroke="#e2e8f0" stroke-width="2"/>
  <text x="44" y="188" class="label">동기 승인</text>
  <text x="44" y="224" class="body muted">결과까지 대기</text>
  <rect class="node" x="280" y="160" width="210" height="78" rx="14" fill="#eff6ff" stroke="#90b8ef"/>
  <text x="385" y="208" text-anchor="middle" class="label">심사</text>
  <path d="M 505 199 H 598" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="node" x="617" y="160" width="260" height="78" rx="14" fill="#edf9f3" stroke="#86c5a5"/>
  <text x="747" y="208" text-anchor="middle" class="label">송금 확정</text>
  <text x="280" y="282" class="body muted">심사와 외부 송금 결과를 확인한 뒤 완료 응답</text>

  <text x="44" y="372" class="label">비동기 승인</text>
  <text x="44" y="408" class="body muted">접수를 먼저 응답</text>
  <rect class="node" x="280" y="344" width="210" height="78" rx="14" fill="#eff6ff" stroke="#90b8ef"/>
  <text x="385" y="392" text-anchor="middle" class="label">심사</text>
  <path d="M 505 383 H 598" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="node" x="617" y="344" width="260" height="78" rx="14" fill="#edf9f3" stroke="#86c5a5"/>
  <text x="747" y="392" text-anchor="middle" class="label">송금 확정</text>
  <text x="280" y="466" class="body muted">접수 응답 후 진행, 최종 결과는 조회나 알림으로 전달</text>

  <text x="44" y="556" class="label">사후 탐지</text>
  <text x="44" y="592" class="body muted">확정 뒤 분석</text>
  <rect class="node" x="280" y="528" width="210" height="78" rx="14" fill="#edf9f3" stroke="#86c5a5"/>
  <text x="385" y="576" text-anchor="middle" class="label">송금 확정</text>
  <path d="M 505 567 H 598" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="node" x="617" y="528" width="260" height="78" rx="14" fill="#fff7e8" stroke="#ddbb70"/>
  <text x="747" y="576" text-anchor="middle" class="label">이상 징후 분석</text>
  <text x="280" y="650" class="body muted">이미 확정한 송금은 이 분석으로 사전 차단할 수 없음</text>
  <text x="42" y="711" class="body muted">위 두 승인 방식은 모두 심사를 통과한 뒤 송금을 진행한다.</text>
</svg>
